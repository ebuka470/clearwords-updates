<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E8B57">
<title>ClearWords — Learn</title>
  <!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- Theme color (browser chrome tint on mobile) -->
<meta name="theme-color" content="#2E8B57">

<!-- iOS: full-screen web app when added to home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClearWords">
<link rel="apple-touch-icon" href="/logo.png">

<!-- Android: enables install prompt -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="ClearWords">
<meta name="msapplication-TileColor" content="#2E8B57">
<meta name="msapplication-TileImage" content="/logo.png">
<style>
/* ============ DESIGN TOKENS ============ */
:root {
  --brand: #2E8B57;
  --brand-rgb: 46,139,87;
  --gold: #E8B33C;
  --gold-rgb: 232,179,60;
  --indigo: #3B5BA5;
  --indigo-rgb: 59,91,165;
  --terracotta: #D97757;
  --terracotta-rgb: 217,119,87;
  --danger: #E5484D;
  --danger-rgb: 229,72,77;
  --bg: #FAF7F2;
  --bg-elev: #FFFFFF;
  --card: #FFFFFF;
  --text: #1C1E21;
  --text-2: #6B6F76;
  --text-3: #9AA0A6;
  --border: #E5E1D8;
  --border-strong: #D4CFC2;
  --shadow: 0 2px 12px rgba(28,30,33,0.06);
  --shadow-lg: 0 8px 28px rgba(28,30,33,0.10);
  --radius: 14px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0F1114;
  --bg-elev: #16191D;
  --card: #1A1D21;
  --text: #F2EFE9;
  --text-2: #9AA0A6;
  --text-3: #6B6F76;
  --border: #2A2E33;
  --border-strong: #3A3E44;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.6);
  --brand: #4CAF7A;
  --brand-rgb: 76,175,122;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  transition: background-color .25s, color .25s;
  padding-bottom: calc(84px + var(--safe-bot));
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img, svg { display: block; max-width: 100%; }
::-webkit-scrollbar { width: 0; height: 0; }

#cw-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: saturate(180%) blur(12px);
}
.hdr-left, .hdr-right { display: flex; align-items: center; gap: 8px; }
.lang-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--radius-full);
  background: var(--card); border: 1px solid var(--border);
  font-size: 14px; font-weight: 700;
}
.lang-pill .chev { color: var(--text-3); font-size: 11px; }
.icon-btn {
  width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--card); border: 1px solid var(--border);
  position: relative; color: var(--text);
}
.streak-btn { width: auto; padding: 0 12px; gap: 4px; font-weight: 700; font-size: 13px; color: var(--gold); background: rgba(var(--gold-rgb), 0.12); border-color: rgba(var(--gold-rgb), 0.28); }
.streak-icon { font-size: 14px; }
.notif-dot {
  position: absolute; top: 8px; right: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--card);
}

.page { max-width: 520px; margin: 0 auto; padding: 0 16px; }
.greeting { padding: 22px 4px 4px; }
.greeting h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.greeting p { font-size: 14px; color: var(--text-2); margin-top: 4px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.card-tint-primary { background: rgba(var(--brand-rgb), 0.06); border-color: rgba(var(--brand-rgb), 0.22); }
.card-tint-gold { background: rgba(var(--gold-rgb), 0.06); border-color: rgba(var(--gold-rgb), 0.22); }

.section-h { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--text-3); text-transform: uppercase; margin: 24px 6px 10px; }

.stat-row { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 12px; }
.stat-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 8px 12px; text-align: center; box-shadow: var(--shadow); }
.stat-ico { font-size: 22px; line-height: 1; }
.stat-val { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
.stat-lbl { font-size: 10.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: 1px; }

.nudge {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px; padding: 14px 16px; border-radius: var(--radius);
  background: rgba(var(--gold-rgb), .10); border: 1px solid rgba(var(--gold-rgb), .30);
  font-size: 13.5px; line-height: 1.45;
}
.nudge.heritage { background: linear-gradient(135deg, rgba(var(--brand-rgb), .12), rgba(var(--gold-rgb), .12)); border-color: rgba(var(--brand-rgb), .30); }
.nudge-ico { font-size: 26px; flex-shrink: 0; }
.nudge-body { flex: 1; min-width: 0; }
.nudge-body b { display: block; font-size: 14.5px; margin-bottom: 2px; }
.nudge-link { color: var(--brand); font-weight: 800; font-size: 13px; white-space: nowrap; }

.continue-card { padding: 18px; }
.continue-row { display: flex; align-items: center; gap: 14px; }
.continue-emoji {
  width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
  background: rgba(var(--brand-rgb), 0.14);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.continue-body { flex: 1; min-width: 0; }
.continue-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--brand); text-transform: uppercase; }
.continue-title { font-size: 17px; font-weight: 800; margin-top: 2px; line-height: 1.25; }
.continue-desc { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.continue-meta { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
.continue-meta span { display: inline-flex; align-items: center; gap: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px; border-radius: var(--radius-full);
  font-weight: 700; font-size: 15px;
  background: var(--brand); color: #fff;
  min-height: 46px;
  transition: transform .08s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; }
.btn-ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
.btn-secondary { background: var(--text); color: var(--bg); }
.btn-sm { padding: 9px 16px; min-height: 36px; font-size: 13px; }
.btn-block { width: 100%; margin-top: 14px; }

.progress-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.progress-lang { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.progress-lvl { font-size: 12px; color: var(--text-2); font-weight: 700; }
.progress-track { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand), var(--gold)); border-radius: 4px; transition: width .4s ease; }

.level-list.set-group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.level-card {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px;
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  transition: background .1s;
  text-align: left; width: 100%;
}
.level-card:last-child { border-bottom: none; }
.level-card:active { background: rgba(var(--brand-rgb), 0.07); }
.level-card.completed { background: rgba(var(--brand-rgb), 0.04); }
.level-card.locked { opacity: .55; }
.level-badge {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px;
  background: rgba(var(--brand-rgb), 0.12); color: var(--brand);
}
.level-card.locked .level-badge { background: var(--border); color: var(--text-2); }
.level-card.completed .level-badge { background: var(--brand); color: #fff; }
.level-body { flex: 1; min-width: 0; }
.level-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
.level-desc { font-size: 12.5px; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.level-tags { display: flex; gap: 10px; margin-top: 5px; font-size: 11px; color: var(--text-3); }
.level-chev { color: var(--text-3); font-size: 20px; }

.skel { background: linear-gradient(90deg, var(--border) 0%, var(--border-strong) 50%, var(--border) 100%); background-size: 200% 100%; animation: skel 1.2s infinite; border-radius: 8px; }
.skel-row { height: 14px; margin: 8px 0; }
.skel-row.w-40 { width: 40%; }
.skel-row.w-70 { width: 70%; }
.skel-block { height: 74px; }
@keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.empty-note { color: var(--text-2); font-size: 14px; text-align: center; padding: 30px 16px; }
.empty-note strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 6px; }

#cw-bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 8px calc(8px + var(--safe-bot));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
  max-width: 520px; margin: 0 auto;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; border-radius: 10px;
  color: var(--text-3); font-size: 11px; font-weight: 600;
  transition: color .15s; position: relative;
}
.tab.active { color: var(--brand); }
.tab svg { width: 22px; height: 22px; }
.tab:active { transform: scale(.94); }
.tab-badge {
  position: absolute; top: 2px; right: 22%;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center;
  box-shadow: 0 0 0 2px var(--card); pointer-events: none; animation: badgePop .25s ease;
}
@keyframes badgePop { 0% { transform: scale(.4); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

.cw-modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.cw-modal-overlay.active { display: flex; }
.cw-modal {
  width: 100%; max-width: 520px;
  max-height: 90vh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 24px 24px 0 0;
  animation: modalUp .25s ease;
  border: 1px solid var(--border); border-bottom: none;
}
.cw-modal::before { content: ''; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 8px auto 0; }
@keyframes modalUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.cw-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 12px; border-bottom: 1px solid var(--border); }
.cw-modal-title { font-weight: 800; font-size: 16px; }
.cw-modal-close { font-size: 26px; line-height: 1; color: var(--text-2); padding: 0 4px; }
.cw-modal-body { padding: 16px 20px 24px; overflow-y: auto; flex: 1; }

.lang-option {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 14px 16px; margin-bottom: 8px;
  border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg-elev); text-align: left;
}
.lang-option.active { border-color: var(--brand); background: rgba(var(--brand-rgb), 0.08); }
.lang-emoji { font-size: 22px; }
.lang-name { flex: 1; font-weight: 700; font-size: 15px; }
.lang-check { color: var(--brand); font-weight: 800; }

.notif-item { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg-elev); border: 1px solid var(--border); margin-bottom: 8px; }
.notif-item.unread { border-color: rgba(var(--brand-rgb), 0.35); background: rgba(var(--brand-rgb), 0.05); }
.notif-icon { font-size: 20px; flex-shrink: 0; }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-weight: 700; font-size: 13px; }
.notif-text { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.notif-time { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.modal-loading { padding: 40px; text-align: center; color: var(--text-2); font-size: 14px; }

.cw-toast {
  position: fixed; left: 50%; bottom: 100px;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 12px 20px; border-radius: var(--radius-full);
  font-size: 14px; font-weight: 600; z-index: 20000;
  opacity: 0; transition: opacity .2s, transform .2s;
  max-width: 90%; text-align: center;
  box-shadow: var(--shadow-lg);
}
.cw-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.cw-toast-error { background: var(--danger); color: #fff; }
.cw-toast-success { background: var(--brand); color: #fff; }

#lesson-flow {
  position: fixed; inset: 0; z-index: 80;
  background: var(--bg);
  display: none;
  flex-direction: column;
}
#lesson-flow.active { display: flex; }
.lesson-topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(14px + var(--safe-top)) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.lesson-close { font-size: 22px; color: var(--text-2); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
.lesson-progress { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.lesson-progress-fill { height: 100%; background: var(--brand); border-radius: 4px; transition: width .35s ease; }
.lesson-step-count { font-size: 12px; font-weight: 700; color: var(--text-2); }

.lesson-body { flex: 1; overflow-y: auto; padding: 24px 16px 120px; max-width: 520px; margin: 0 auto; width: 100%; }
.lesson-foot {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(14px + var(--safe-bot));
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex; gap: 10px;
  max-width: 520px; margin: 0 auto;
}

.lesson-hero { text-align: center; padding: 20px 0 24px; }
.lesson-hero-eyebrow { font-size: 12px; font-weight: 800; color: var(--brand); letter-spacing: .1em; text-transform: uppercase; }
.lesson-hero h2 { font-size: 26px; font-weight: 800; margin: 8px 0 6px; letter-spacing: -0.02em; }
.lesson-hero p { color: var(--text-2); font-size: 15px; }
.lesson-outline { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.outline-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
.outline-icon { width: 40px; height: 40px; border-radius: 11px; background: rgba(var(--brand-rgb), 0.12); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.outline-body { flex: 1; }
.outline-title { font-weight: 700; font-size: 14.5px; }
.outline-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }

.word-slide { animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.word-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px 22px;
  text-align: center; margin-bottom: 16px;
}
.word-term { font-size: 32px; font-weight: 800; color: var(--brand); letter-spacing: -0.02em; line-height: 1.15; }
.word-pron { font-size: 14px; color: var(--text-3); margin-top: 6px; font-style: italic; }
.word-trans { font-size: 20px; font-weight: 600; margin-top: 14px; }
.word-ex { font-size: 14px; color: var(--text-2); margin-top: 14px; line-height: 1.5; padding-top: 14px; border-top: 1px dashed var(--border); }
.word-ex strong { color: var(--text); font-weight: 700; }
.word-ex-trans { font-size: 12.5px; color: var(--text-3); margin-top: 4px; font-style: italic; }
.word-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.word-audio {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-full);
  background: var(--brand); color: #fff; font-weight: 700; font-size: 14px;
}
.word-audio.playing { background: var(--gold); color: #1C1E21; }
.word-save-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-full);
  background: transparent; color: var(--text-2);
  border: 1.5px solid var(--border); font-weight: 700; font-size: 14px;
}
.word-save-btn.saved { color: var(--gold); border-color: var(--gold); background: rgba(var(--gold-rgb), 0.08); }
.word-counter { text-align: center; font-size: 12.5px; color: var(--text-3); font-weight: 700; margin-top: 6px; }

.dlg-line { display: flex; gap: 12px; margin-bottom: 14px; animation: fade .35s ease; }
.dlg-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; font-size: 13px; }
.dlg-bubble { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 12px 14px; position: relative; }
.dlg-speaker { font-size: 11px; font-weight: 800; color: var(--brand); letter-spacing: .05em; text-transform: uppercase; }
.dlg-text { font-size: 16px; font-weight: 600; margin-top: 2px; }
.dlg-trans { font-size: 13px; color: var(--text-2); margin-top: 6px; font-style: italic; }
.dlg-play { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(var(--brand-rgb), 0.12); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.dlg-play.playing { background: var(--gold); color: #1C1E21; }

.ctx-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.ctx-title { font-weight: 800; color: var(--gold); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.ctx-body { font-size: 14.5px; color: var(--text); margin-top: 8px; line-height: 1.55; }
.grammar-block { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.grammar-concept { font-weight: 800; color: var(--indigo); font-size: 14px; }
.grammar-exp { font-size: 14px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }

.ex-question { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em; }
.ex-prompt { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
.ex-options { display: flex; flex-direction: column; gap: 10px; }
.ex-opt {
  padding: 16px 18px; border-radius: 12px;
  background: var(--card); border: 1.5px solid var(--border);
  text-align: left; font-size: 15px; font-weight: 600;
  transition: all .15s;
}
.ex-opt:active { transform: scale(.985); }
.ex-opt.correct { border-color: var(--brand); background: rgba(var(--brand-rgb), 0.10); color: var(--brand); }
.ex-opt.wrong { border-color: var(--danger); background: rgba(229,72,77,0.08); color: var(--danger); }
.ex-opt:disabled { cursor: default; }

.complete-wrap { text-align: center; padding: 20px 0; }
.complete-emoji { font-size: 72px; animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.complete-h { font-size: 28px; font-weight: 800; margin-top: 10px; letter-spacing: -0.02em; }
.complete-sub { color: var(--text-2); font-size: 15px; margin-top: 6px; }
.complete-stats { display: flex; gap: 10px; justify-content: center; margin: 22px 0; flex-wrap: wrap; }
.complete-stat { padding: 12px 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); text-align: center; min-width: 90px; }
.complete-stat-val { font-size: 20px; font-weight: 800; color: var(--brand); }
.complete-stat-lbl { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; font-weight: 700; }

.first-card {
  margin: 20px 0 4px; padding: 18px; border-radius: var(--radius-lg); text-align: left;
  background: linear-gradient(135deg, rgba(var(--brand-rgb), .16), rgba(var(--gold-rgb), .18));
  border: 1.5px solid rgba(var(--brand-rgb), .4); animation: pop .5s ease;
}
.first-card b { display: block; font-size: 16px; }
.first-card p { font-size: 13.5px; color: var(--text-2); margin-top: 4px; line-height: 1.45; }

.custom-trigger {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 14px 18px; border-radius: var(--radius-full);
  background: var(--card); border: 1.5px dashed rgba(var(--brand-rgb), 0.5);
  margin-bottom: 4px; font-weight: 700; color: var(--brand); font-size: 14px;
}
.custom-trigger:active { background: rgba(var(--brand-rgb), 0.05); }
.custom-trigger .left { display: flex; align-items: center; gap: 8px; }

.topic-input {
  width: 100%; padding: 14px 16px; font-size: 16px;
  border-radius: 12px; background: var(--bg-elev);
  border: 1.5px solid var(--border); color: var(--text);
  font-family: inherit;
}
.topic-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), 0.12); }

.loader { text-align: center; padding: 30px 0; }
.spinner {
  width: 42px; height: 42px; border: 4px solid var(--border);
  border-top-color: var(--brand); border-radius: 50%;
  margin: 0 auto 14px; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-txt { font-size: 14px; color: var(--text-2); }
.loader-sub { font-size: 12.5px; color: var(--text-3); margin-top: 6px; font-style: italic; }

.chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
.chip {
  padding: 8px 14px; border-radius: var(--radius-full);
  background: var(--card); border: 1.5px solid var(--border);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  color: var(--text-2);
}
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }

@media (max-width: 380px) {
  .word-term { font-size: 26px; }
  .greeting h1 { font-size: 21px; }
  .lesson-hero h2 { font-size: 22px; }
  .complete-h { font-size: 24px; }
  .stat-val { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header id="cw-header"></header>

<main class="page">
  <div class="greeting">
    <h1 id="hello">Good evening</h1>
    <p id="hello-sub">A little language today can stay with you for a long time.</p>
  </div>

  <div class="stat-row">
    <div class="stat-tile"><div class="stat-ico">🔥</div><div class="stat-val" id="l-streak">0</div><div class="stat-lbl">Day streak</div></div>
    <div class="stat-tile"><div class="stat-ico">⭐</div><div class="stat-val" id="l-xp">0</div><div class="stat-lbl">Total XP</div></div>
    <div class="stat-tile"><div class="stat-ico">🧭</div><div class="stat-val" id="l-level">1</div><div class="stat-lbl">Level</div></div>
  </div>

  <div id="heritage-nudge"></div>

  <div class="card card-tint-primary continue-card" id="continue-card">
    <div class="skel skel-row w-40"></div>
    <div class="skel skel-row w-70"></div>
    <div class="skel skel-block" style="margin-top: 12px;"></div>
  </div>

  <div class="card" id="progress-card">
    <div class="skel skel-row w-40"></div>
    <div class="skel skel-block" style="margin-top: 12px; height: 8px;"></div>
  </div>

  <button class="custom-trigger" onclick="Learn.openCustomLesson()">
    <span class="left">⚡ <span>Create an instant lesson</span></span>
    <span style="color: var(--text-3); font-size: 20px;">›</span>

  <div class="section-h">Your journey</div>
  <div class="chip-row" id="level-filters">
    <button class="chip active" data-f="all">All</button>

    <button class="chip" data-f="completed">Completed</button>

  <div class="level-list set-group" id="level-list">
    <div class="card" style="margin:0;border:none;box-shadow:none"><div class="skel skel-row w-40"></div><div class="skel skel-row w-70"></div></div>
    <div class="card" style="margin:0;border:none;box-shadow:none"><div class="skel skel-row w-40"></div><div class="skel skel-row w-70"></div></div>
    <div class="card" style="margin:0;border:none;box-shadow:none"><div class="skel skel-row w-40"></div><div class="skel skel-row w-70"></div></div>
  </div>
</main>

<nav id="cw-bottom-nav">

      <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>

    <span>Practice</span>
  </button>
  <button class="tab" onclick="Nav.go('community')">

      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>

      <circle cx="12" cy="7" r="4"></circle>

    <span>Profile</span>
  </button>
</nav>

<div id="lesson-flow">
  <div class="lesson-topbar">
    <button class="lesson-close" onclick="Learn.closeLesson()">✕</button>
    <div class="lesson-progress"><div class="lesson-progress-fill" id="lesson-progress-fill"></div></div>
    <div class="lesson-step-count" id="lesson-step-count">1 / 6</div>
  </div>
  <div class="lesson-body" id="lesson-body"></div>
  <div class="lesson-foot" id="lesson-foot"></div>
</div>

<script src="shared.js"></script>
  <script src="sharecards.js"></script>
<script>
const Learn = {
  curriculum: null,
  progress: null,
  user: null,
  lessons: [],
  activeFilter: 'all',

  async init() {
    const ok = await cwBoot();
    if (!ok) return;

    Header.render('learn');
    this.user = State.user;
    this.setGreeting();
    this.renderProgressSkeleton();
    this.renderStats();

    const lang = State.currentLanguage;
    const [curr, prog] = await Promise.allSettled([
      State.loadCurriculum(lang),
      State.loadProgress(lang)
    ]);

    if (curr.status === 'fulfilled' && curr.value) {
      this.curriculum = curr.value;
      this.lessons = Curriculum.allLessons(this.curriculum);
    } else {
      this.showCurriculumError();
      return;
    }

    if (prog.status === 'fulfilled') this.progress = prog.value;

    State.on('progress:changed', p => { this.progress = p; this.render(); });
    State.on('hydrated', () => { this.user = State.user; this.setGreeting(); this.render(); });
    State.on('profile:changed', () => { this.user = State.user; this.render(); });

    this.bindFilters();
    this.render();
  },

  setGreeting() {
    const h = new Date().getHours();
    const greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const name = (this.user && (this.user.fullName || this.user.name || this.user.firstName)) || 'friend';
    const first = String(name).split(' ')[0];
    document.getElementById('hello').textContent = greeting + ', ' + first + '.';
    document.getElementById('hello-sub').textContent = 'A little language today can stay with you for a long time.';
  },

  bindFilters() {
    document.querySelectorAll('#level-filters .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#level-filters .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        this.activeFilter = chip.dataset.f;
        this.renderLevels();
      });
    });
  },

  renderProgressSkeleton() {
    const cont = document.getElementById('continue-card');
    const prog = document.getElementById('progress-card');
    cont.innerHTML = `
      <div class="continue-row">
        <div class="continue-emoji">📖</div>
        <div class="continue-body">
          <div class="continue-eyebrow">Continue journey</div>
          <div class="continue-title" id="continue-title">Loading…</div>
          <div class="continue-desc" id="continue-desc">&nbsp;</div>
        </div>
      </div>`;
    prog.innerHTML = `
      <div class="progress-head">
        <div class="progress-lang">📚 <span id="pc-lang">—</span></div>
        <div class="progress-lvl" id="pc-lvl">—</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="pc-fill" style="width: 0%"></div></div>`;
  },

  render() {
    this.renderStats();
    this.renderHeritage();
    this.renderContinue();
    this.renderProgress();
    this.renderLevels();
  },

  renderStats() {
    const p = this.progress || State.progress || {};
    const completed = (p.completedLessons || p.completedLevels || []).length;
    const level = p.currentLevel || (this.curriculum ? this.computeLevel(completed) : 1);
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('l-streak', State.effectiveStreak(p));
    set('l-xp', (p.totalXP || 0).toLocaleString());
    set('l-level', level);
  },

  renderHeritage() {
    const host = document.getElementById('heritage-nudge');
    if (!host) return;
    const u = this.user || State.user || {};
    if (!window.Heritage || !Heritage.isHeritage(u)) { host.innerHTML = ''; return; }
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage] || {};
    const next = this.curriculum ? Curriculum.nextIncompleteLesson(this.curriculum, this.progress) : null;
    host.innerHTML = `
      <div class="nudge heritage">
        <div class="nudge-ico">🌳</div>
        <div class="nudge-body"><b>${esc(Heritage.line(u, langCfg.name || 'your language'))}</b>One short lesson today gets you closer.</div>
        ${next ? `<button class="nudge-link" onclick="Learn.startLesson('${next.id}')">Start</button>` : ''}
      </div>`;
  },

  renderContinue() {
    const cont = document.getElementById('continue-card');
    if (!cont) return;

    const next = Curriculum.nextIncompleteLesson(this.curriculum, this.progress);
    if (!next) {
      cont.innerHTML = `<div class="empty-note"><strong>You've reached the end.</strong>More levels are on the way.</div>`;
      return;
    }

    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];

    cont.innerHTML = `
      <div class="continue-row">
        <div class="continue-emoji">${langCfg.emoji}</div>
        <div class="continue-body">
          <div class="continue-eyebrow">Continue journey</div>
          <div class="continue-title">Level ${next.levelNumber} · ${esc(next.title)}</div>
          <div class="continue-desc">${esc((next.description || '').slice(0, 90))}</div>
          <div class="continue-meta">
            <span>⏱ ${esc(next.estimatedTime || '15 min')}</span>
            <span>⭐ ${next.xpReward || 25} XP</span>
            <span>📊 ${esc(next.difficulty || 'Beginner')}</span>
          </div>
        </div>
      </div>
      <button class="btn btn-block" onclick="Learn.startLesson('${next.id}')">
        Start lesson →
      </button>`;
  },

  renderProgress() {
    const card = document.getElementById('progress-card');
    if (!card) return;
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
    const p = this.progress || {};
    const completed = (p.completedLessons || p.completedLevels || []).length;
    const total = this.lessons.length || 1;
    const pct = Math.min(100, Math.round((completed / total) * 100));
    const level = p.currentLevel || this.computeLevel(completed);

    card.innerHTML = `
      <div class="progress-head">
        <div class="progress-lang">${langCfg.emoji} <span>${esc(langCfg.name)}</span></div>
        <div class="progress-lvl">Level ${level}</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width: ${pct}%"></div></div>
      <div style="font-size: 12px; color: var(--text-2); margin-top: 8px; font-weight: 600;">
        ${completed} of ${total} lessons complete · ${pct}%
      </div>`;
  },

  computeLevel(completedCount) {
    if (!this.curriculum) return 1;
    let count = 0;
    for (const lvl of this.curriculum.levels) {
      count += lvl.lessons.length;
      if (completedCount < count) return lvl.level;
    }
    return this.curriculum.levels[this.curriculum.levels.length - 1]?.level || 1;
  },

  renderLevels() {
    const list = document.getElementById('level-list');
    if (!list) return;
    if (!this.curriculum) return;

    const completed = Curriculum.completedLessonIds(this.progress);
    const currentLevel = this.progress?.currentLevel || this.computeLevel(completed.length);
    const f = this.activeFilter;

    const rows = [];
    for (const lvl of this.curriculum.levels) {
      for (const lesson of lvl.lessons) {
        const done = completed.includes(lesson.id) || completed.includes(lesson.levelNumber);
        const unlocked = lvl.level <= currentLevel;
        const inProgress = unlocked && !done && lvl.level === currentLevel;

        let state = 'locked';
        if (done) state = 'completed';
        else if (unlocked) state = 'unlocked';

        if (f === 'in-progress' && !inProgress) continue;
        if (f === 'completed' && !done) continue;
        if (f === 'locked' && state !== 'locked') continue;

        rows.push({ lesson, state, level: lvl.level });
      }
    }

    if (!rows.length) {
      list.innerHTML = `<div class="empty-note">No lessons match this filter.</div>`;
      return;
    }

    list.innerHTML = rows.map(({ lesson, state }) => {
      const icon = state === 'completed' ? '✓'
                  : state === 'locked' ? '🔒'
                  : '▶';
      const tags = `
        <span>⏱ ${esc(lesson.estimatedTime || '15 min')}</span>
        <span>⭐ ${lesson.xpReward || 25} XP</span>`;
      return `
        <button class="level-card ${state}" onclick="Learn.onLevelClick('${lesson.id}', '${state}')">
          <div class="level-badge">${icon}</div>
          <div class="level-body">
            <div class="level-title">${esc(lesson.title)}</div>
            <div class="level-desc">${esc((lesson.description || lesson.topic || '').slice(0, 100))}</div>
            <div class="level-tags">${tags}</div>
          </div>
          <div class="level-chev">›</div>
        </button>`;
    }).join('');
  },

  onLevelClick(lessonId, state) {
    if (state === 'locked') {
      showToast('Complete earlier lessons first.', 'info');
      return;
    }
    this.startLesson(lessonId);
  },

  showCurriculumError() {
    document.getElementById('continue-card').innerHTML = `
      <div class="empty-note">
        <strong>Couldn't load your lessons.</strong>
        <button class="btn" style="margin-top: 14px;" onclick="location.reload()">Retry</button>
      </div>`;
    document.getElementById('progress-card').style.display = 'none';
    document.getElementById('level-list').innerHTML = '';
  },

  /* ============================================================
     LESSON ENGINE
     ============================================================ */
  activeLesson: null,
  steps: [],
  stepIndex: 0,
  exerciseAnswers: [],

  startLesson(lessonId) {
    const found = Curriculum.findLesson(this.curriculum, lessonId);
    if (!found) { showToast('Lesson not found.', 'error'); return; }
    const { lesson } = found;

    this.activeLesson = lesson;
    this.buildSteps(lesson);
    this.stepIndex = 0;
    this.exerciseAnswers = [];

    document.getElementById('lesson-flow').classList.add('active');
    document.body.style.overflow = 'hidden';
    this.renderStep();
  },

  buildSteps(lesson) {
    const steps = [];
    steps.push({ type: 'intro' });

    if ((lesson.vocabulary || []).length) steps.push({ type: 'words', data: lesson.vocabulary });
    if ((lesson.dialogue || []).length) steps.push({ type: 'dialogue', data: lesson.dialogue });
    if ((lesson.culturalNotes || []).length) steps.push({ type: 'context', data: lesson.culturalNotes });
    if ((lesson.grammarPoints || []).length) steps.push({ type: 'grammar', data: lesson.grammarPoints });
    if ((lesson.practiceExercises || []).length) steps.push({ type: 'practice', data: lesson.practiceExercises });

    steps.push({ type: 'complete' });
    this.steps = steps;
  },

  renderStep() {
    const step = this.steps[this.stepIndex];
    if (!step) return;

    const total = this.steps.length;
    const current = this.stepIndex + 1;
    document.getElementById('lesson-progress-fill').style.width = (current / total * 100) + '%';
    document.getElementById('lesson-step-count').textContent = current + ' / ' + total;

    const body = document.getElementById('lesson-body');
    const foot = document.getElementById('lesson-foot');

    body.innerHTML = '';
    foot.innerHTML = '';

    switch (step.type) {
      case 'intro':     this.renderIntro(body, foot); break;
      case 'words':     this.renderWords(step.data, body, foot); break;
      case 'dialogue':  this.renderDialogue(step.data, body, foot); break;
      case 'context':   this.renderContext(step.data, body, foot); break;
      case 'grammar':   this.renderGrammar(step.data, body, foot); break;
      case 'practice':  this.renderPractice(step.data, body, foot); break;
      case 'complete':  this.renderComplete(body, foot); break;
    }
    body.scrollTop = 0;
  },

  nextStep() {
    if (this.stepIndex < this.steps.length - 1) {
      this.stepIndex++;
      this.renderStep();
    }
  },

  prevStep() {
    if (this.stepIndex > 0) {
      this.stepIndex--;
      this.renderStep();
    }
  },

  closeLesson() {
    AudioMgr.stop();
    document.getElementById('lesson-flow').classList.remove('active');
    document.body.style.overflow = '';
    State.loadProgress(State.currentLanguage).then(p => {
      if (p) { this.progress = p; this.render(); }
    });
  },

  renderIntro(body, foot) {
    const lesson = this.activeLesson;
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];

    const outline = [];
    if ((lesson.vocabulary || []).length) outline.push({ icon: '📚', title: (lesson.vocabulary.length) + ' new words', sub: 'Vocabulary with audio' });
    if ((lesson.dialogue || []).length) outline.push({ icon: '💬', title: 'Dialogue', sub: 'Practice real conversation' });
    if ((lesson.culturalNotes || []).length) outline.push({ icon: '🌍', title: 'Cultural context', sub: 'When to use these words' });
    if ((lesson.grammarPoints || []).length) outline.push({ icon: '📐', title: 'Grammar pattern', sub: 'How the language fits together' });
    if ((lesson.practiceExercises || []).length) outline.push({ icon: '🎯', title: 'Practice', sub: 'Quick check-yourself questions' });

    body.innerHTML = `
      <div class="lesson-hero">
        <div class="lesson-hero-eyebrow">${langCfg.emoji} ${esc(langCfg.name)} · ${esc(lesson.difficulty || 'Beginner')}</div>
        <h2>${esc(lesson.title)}</h2>
        <p>${esc(lesson.description || 'Learn a few expressions you can actually use.')}</p>
      </div>
      <div class="lesson-outline">
        ${outline.map(o => `
          <div class="outline-item">
            <div class="outline-icon">${o.icon}</div>
            <div class="outline-body">
              <div class="outline-title">${esc(o.title)}</div>
              <div class="outline-sub">${esc(o.sub)}</div>
            </div>
          </div>`).join('')}
      </div>`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.closeLesson()" style="flex: 0 0 auto;">Not now</button>
      <button class="btn" onclick="Learn.nextStep()" style="flex: 1;">Start lesson →</button>`;
  },

  wordIndex: 0,
  renderWords(vocab, body, foot) {
    const idx = this.wordIndex || 0;
    const w = vocab[idx];
    if (!w) { this.nextStep(); return; }

    const isSaved = this.isWordSaved(w.word);
    const total = vocab.length;
    const pct = Math.round(((idx + 1) / total) * 100);

    body.innerHTML = `
      <div style="font-size: 12px; color: var(--text-3); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Word ${idx + 1} of ${total}</div>
      <div style="height: 6px; background: var(--border); border-radius: 3px; margin: 8px 0 24px; overflow: hidden;">
        <div style="height: 100%; width: ${pct}%; background: var(--brand); border-radius: 3px; transition: width .3s;"></div>
      </div>
      <div class="word-slide">
        <div class="word-card">
          <div class="word-term">${esc(w.word)}</div>
          ${w.pronunciation ? `<div class="word-pron">/${esc(w.pronunciation)}/</div>` : ''}
          <div class="word-trans">${esc(w.translation || '')}</div>
          ${w.example ? `
            <div class="word-ex">
              <strong>${esc(w.example)}</strong>
              ${w.exampleTranslation ? `<div class="word-ex-trans">${esc(w.exampleTranslation)}</div>` : ''}
            </div>` : ''}
        </div>
        <div class="word-actions">
          <button class="word-audio" id="word-audio-btn" onclick="Learn.playCurrentWord()">🔊 Listen</button>
          <button class="word-save-btn ${isSaved ? 'saved' : ''}" id="word-save-btn" onclick="Learn.toggleSaveWord()">
            ${isSaved ? '★ Saved' : '☆ Save'}
          </button>
        </div>
      </div>`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.wordBack()" style="flex: 0 0 auto;">← Back</button>
      <button class="btn" onclick="Learn.wordNext()" style="flex: 1;">
        ${idx === total - 1 ? 'Next section →' : 'Next word →'}
      </button>`;
  },

  async playCurrentWord() {
    const w = this.activeLesson.vocabulary[this.wordIndex];
    if (!w) return;
    const btn = document.getElementById('word-audio-btn');
    if (btn) { btn.classList.add('playing'); btn.textContent = '🔊 Playing…'; }
    try {
      await AudioMgr.play(w.word, State.currentLanguage);
    } catch (e) {
      if (!Paywall.fromError(e)) {
        showToast('Audio unavailable right now.', 'error');
      }
    }
    if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; }
  },

  wordNext() {
    const vocab = this.activeLesson.vocabulary || [];
    if (this.wordIndex < vocab.length - 1) {
      this.wordIndex++;
      this.renderStep();
    } else {
      this.wordIndex = 0;
      this.nextStep();
    }
  },

  wordBack() {
    if (this.wordIndex > 0) {
      this.wordIndex--;
      this.renderStep();
    } else {
      this.prevStep();
    }
  },

  isWordSaved(word) {
    const saved = (this.user && this.user.savedWords) || [];
    return saved.some(s => s.word === word);
  },

  async toggleSaveWord() {
    const w = this.activeLesson.vocabulary[this.wordIndex];
    if (!w) return;
    const saved = (this.user && this.user.savedWords) || [];
    const exists = saved.some(s => s.word === w.word);

    let updated;
    if (exists) {
      updated = saved.filter(s => s.word !== w.word);
      showToast('Removed from saved words', 'info');
    } else {
      updated = [...saved, {
        word: w.word,
        translation: w.translation,
        pronunciation: w.pronunciation,
        example: w.example,
        language: State.currentLanguage,
        savedAt: new Date().toISOString()
      }];
      showToast('Saved ★', 'success');
    }

    if (this.user) this.user.savedWords = updated;
    if (State.user) State.user.savedWords = updated;
    Auth.setUser(State.user || this.user);

    const btn = document.getElementById('word-save-btn');
    if (btn) {
      const nowSaved = !exists;
      btn.classList.toggle('saved', nowSaved);
      btn.textContent = nowSaved ? '★ Saved' : '☆ Save';
    }

    try {
      await Backend.updateProfile({ savedWords: updated });
    } catch (e) {
      // silent
    }
  },

  renderDialogue(dialogue, body, foot) {
    const lines = dialogue.map((d, i) => {
      const initial = (d.speaker || 'A').substring(0, 1).toUpperCase();
      const speakerColor = d.speaker === 'A' ? 'var(--brand)' : 'var(--indigo)';
      return `
        <div class="dlg-line">
          <div class="dlg-avatar" style="background: ${speakerColor};">${initial}</div>
          <div class="dlg-bubble">
            <div class="dlg-speaker">${esc(d.speaker || 'Speaker')}</div>
            <div class="dlg-text">${esc(d.text)}</div>
            ${d.translation ? `<div class="dlg-trans">${esc(d.translation)}</div>` : ''}
            <button class="dlg-play" onclick="Learn.playDialogueLine(${i})" id="dlg-play-${i}">🔊</button>
          </div>
        </div>`;
    }).join('');

    body.innerHTML = `
      <div class="lesson-hero" style="padding-bottom: 10px;">
        <div class="lesson-hero-eyebrow">Conversation</div>
        <h2 style="font-size: 22px;">Listen and read along</h2>
        <p>Tap any line to replay it. Try saying it out loud.</p>
      </div>
      <div>${lines}</div>
      <button class="btn btn-ghost btn-block" onclick="Learn.playAllDialogue()" style="margin-top: 8px;">
        🔊 Play entire dialogue
      </button>`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.prevStep()" style="flex: 0 0 auto;">← Back</button>
      <button class="btn" onclick="Learn.nextStep()" style="flex: 1;">Continue →</button>`;
  },

  async playDialogueLine(i) {
    const line = this.activeLesson.dialogue[i];
    if (!line) return;
    const btn = document.getElementById('dlg-play-' + i);
    if (btn) { btn.classList.add('playing'); btn.textContent = '🔊'; }
    try {
      await AudioMgr.play(line.text, State.currentLanguage);
    } catch (e) {
      if (!Paywall.fromError(e)) {
        showToast('Audio unavailable right now.', 'error');
      }
    }
    if (btn) btn.classList.remove('playing');
  },

  async playAllDialogue() {
    const lines = this.activeLesson.dialogue || [];
    for (let i = 0; i < lines.length; i++) {
      await this.playDialogueLine(i);
      await new Promise(r => setTimeout(r, 350));
    }
  },

  renderContext(notes, body, foot) {
    const html = notes.map(n => `
      <div class="ctx-card">
        <div class="ctx-title">🌍 ${esc(n.title || 'Cultural note')}</div>
        <div class="ctx-body">${esc(n.content || n.text || '')}</div>
      </div>`).join('');

    body.innerHTML = `
      <div class="lesson-hero" style="padding-bottom: 10px;">
        <div class="lesson-hero-eyebrow">Context</div>
        <h2 style="font-size: 22px;">When would you say this?</h2>
      </div>
      ${html}`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.prevStep()" style="flex: 0 0 auto;">← Back</button>
      <button class="btn" onclick="Learn.nextStep()" style="flex: 1;">Continue →</button>`;
  },

  renderGrammar(points, body, foot) {
    const html = points.map(p => `
      <div class="grammar-block">
        <div class="grammar-concept">${esc(p.concept || 'Pattern')}</div>
        <div class="grammar-exp">${esc(p.explanation || p.description || '')}</div>
      </div>`).join('');

    body.innerHTML = `
      <div class="lesson-hero" style="padding-bottom: 10px;">
        <div class="lesson-hero-eyebrow">Grammar</div>
        <h2 style="font-size: 22px;">A useful pattern</h2>
      </div>
      ${html}`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.prevStep()" style="flex: 0 0 auto;">← Back</button>
      <button class="btn" onclick="Learn.nextStep()" style="flex: 1;">Continue →</button>`;
  },

  practiceIndex: 0,
  renderPractice(exercises, body, foot) {
    const idx = this.practiceIndex || 0;
    const ex = exercises[idx];
    if (!ex) { this.nextStep(); return; }

    const total = exercises.length;
    const pct = Math.round(((idx + 1) / total) * 100);

    const opts = (ex.options || ex.choices || []).map((o, i) => {
      const optText = typeof o === 'string' ? o : (o.text || o.option || '');
      return `<button class="ex-opt" onclick="Learn.answerExercise(${i})" id="ex-opt-${i}">${esc(optText)}</button>`;
    }).join('');

    body.innerHTML = `
      <div style="font-size: 12px; color: var(--text-3); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Question ${idx + 1} of ${total}</div>
      <div style="height: 6px; background: var(--border); border-radius: 3px; margin: 8px 0 24px; overflow: hidden;">
        <div style="height: 100%; width: ${pct}%; background: var(--gold); border-radius: 3px;"></div>
      </div>
      <div class="ex-question">${esc(ex.question || ex.prompt || 'Choose the correct answer')}</div>
      ${ex.instruction ? `<div class="ex-prompt">${esc(ex.instruction)}</div>` : ''}
      <div class="ex-options">${opts}</div>`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.prevStep()" style="flex: 0 0 auto;">← Back</button>
      <button class="btn" id="ex-next-btn" disabled onclick="Learn.nextExercise()" style="flex: 1;">Next →</button>`;
  },

  answerExercise(optionIndex) {
    const ex = this.activeLesson.practiceExercises[this.practiceIndex];
    const correct = ex.correctAnswer ?? ex.correctIndex ?? 0;
    const isCorrect = optionIndex === correct;

    document.querySelectorAll('.ex-opt').forEach((b, i) => {
      b.disabled = true;
      if (i === correct) b.classList.add('correct');
      else if (i === optionIndex) b.classList.add('wrong');
    });

    this.exerciseAnswers.push({ q: this.practiceIndex, correct: isCorrect });

    const nextBtn = document.getElementById('ex-next-btn');
    if (nextBtn) {
      nextBtn.disabled = false;
      nextBtn.textContent = isCorrect ? 'Correct! Next →' : 'Next →';
    }
  },

  nextExercise() {
    const ex = this.activeLesson.practiceExercises || [];
    if (this.practiceIndex < ex.length - 1) {
      this.practiceIndex++;
      this.renderStep();
    } else {
      this.practiceIndex = 0;
      this.nextStep();
    }
  },

  async renderComplete(body, foot) {
    AudioMgr.stop();
    const lesson = this.activeLesson;

    body.innerHTML = `
      <div class="complete-wrap">
        <div class="complete-emoji">🎉</div>
        <div class="complete-h">Lesson complete</div>
        <div class="complete-sub">You learned ${(lesson.vocabulary || []).length} words${(lesson.dialogue || []).length ? ' and ' + lesson.dialogue.length + ' dialogue lines' : ''}.</div>
        <div class="complete-stats">
          <div class="complete-stat"><div class="complete-stat-val">+${lesson.xpReward || 25}</div><div class="complete-stat-lbl">XP</div></div>
          <div class="complete-stat"><div class="complete-stat-val">🔥</div><div class="complete-stat-lbl">Streak kept</div></div>
          <div class="complete-stat"><div class="complete-stat-val">${(lesson.vocabulary || []).length}</div><div class="complete-stat-lbl">New words</div></div>
        </div>
        <div id="complete-status" style="font-size: 13px; color: var(--text-2); min-height: 20px;"></div>
        <div id="share-cta"></div>
      </div>`;

    foot.innerHTML = `
      <button class="btn btn-ghost" onclick="Learn.closeLesson()" style="flex: 0 0 auto;">Done</button>
      <button class="btn" onclick="Nav.go('practice')" style="flex: 1;">Practice with Timmy →</button>`;

    await this.submitCompletion();
  },

  /**
   * After the first lesson, offers:
   *   1. A family prompt (Premium/Immersive; only if familyIntent + no profiles + not dismissed)
   *   2. The shareable ClearWords card
   */
    renderShareCta(lessonsDone) {
    const host = document.getElementById('share-cta');
    if (!host || !window.ShareCards || lessonsDone < 1) return;

    const u = State.user || {};
    const profiles = u.familyProfiles || [];
    
    const shouldPromptFamily =
      u.familyIntent === true &&
      profiles.length === 0 &&
      !u.familyPromptDismissedAt;

    const langName = (CW_CONFIG.LANGUAGES[State.currentLanguage] || {}).name || 'your language';

    // Defensive check: if Heritage is not defined, fall back to a generic name
    let firstName = 'Friend';
    try {
      if (typeof Heritage !== 'undefined' && Heritage.firstName) {
        firstName = Heritage.firstName(u) || 'Friend';
      } else if (u.fullName) {
        firstName = u.fullName.split(' ')[0];
      }
    } catch (e) {
      console.warn('Heritage fallback triggered:', e);
    }

    let familyBlock = '';
    if (shouldPromptFamily) {
      familyBlock = `
        <div class="first-card" style="border-color: rgba(var(--gold-rgb), .5); background: linear-gradient(135deg, rgba(var(--gold-rgb), .14), rgba(var(--brand-rgb), .12));">
          <b>👨‍👩‍👧 Add your first learner</b>
          <p>You chose family learning. Give your kids their own profiles — their own streak, lessons, and Timmy chats.</p>
          <div style="display: flex; gap: 10px; margin-top: 12px;">
            <button class="btn" style="flex: 1;" onclick="Learn.addFirstLearner()">Add a learner →</button>
            <button class="btn btn-ghost" style="flex: 1;" onclick="Learn.dismissFamilyPrompt()">Not now</button>
          </div>
        </div>`;
    }

    if (lessonsDone === 1) {
      host.innerHTML = familyBlock + `
        <div class="first-card">
          <b>🪪 Your first lesson is done. Your ClearWords card is ready!</b>
          <p>${esc(firstName)}, you're officially ${esc(ShareCards.art(langName))} ${esc(langName)} learner. See your spirit age and show your family.</p>
          <button class="btn btn-block" onclick="ShareCards.openIdentity()">Make my card →</button>
        </div>`;
    } else {
      host.innerHTML = familyBlock + `<button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="ShareCards.openIdentity()">🪪 Share my ClearWords card</button>`;
    }
  },

     async addFirstLearner() {
    const u = State.user || {};
    const tier = (u.subscriptionTier || 'free').toLowerCase();
    const active = !u.subscriptionExpires || new Date(u.subscriptionExpires) > new Date();
    const eligible = ['premium', 'immersive'].includes(tier) && active;

    if (!eligible) {
      Paywall.show({
        feature: 'family',
        title: 'Family accounts are Premium',
        message: 'Family profiles are included with Premium and Immersive. Each learner gets their own streak, lessons, and Timmy chats.',
        ctaLabel: 'See plans'
      });
      return;
    }

    const langChips = Object.entries(CW_CONFIG.LANGUAGES).map(([k, c]) => {
      const isSelected = State.currentLanguage === k;
      return `
        <button type="button" 
                class="lang-chip ${isSelected ? 'active' : ''}" 
                onclick="Learn.selectFirstLang('${k}', this)">
          ${c.emoji} ${c.name}
        </button>
      `;
    }).join('');

    Header._modal('Add your first learner', `
      <div class="field">
        <label>Name</label>
        <input type="text" id="fl-name" maxlength="40" placeholder="e.g. Chika">
      </div>
      <div class="field">
        <label>Emoji</label>
        <input type="text" id="fl-emoji" maxlength="8" value="🧒">
      </div>
      <div class="field">
        <label>Learning Language</label>
        <div class="lang-chips" id="fl-lang-chips">
          ${langChips}
        </div>
        <input type="hidden" id="fl-language" value="${State.currentLanguage}">
      </div>
      <div class="field-error" id="fl-err"></div>
      <button class="btn btn-block" id="fl-save" onclick="Learn.submitFirstLearner()">Create profile</button>
    `);
  },

    async submitFirstLearner() {
    const name = document.getElementById('fl-name').value.trim();
    const emoji = document.getElementById('fl-emoji').value.trim();
    const language = document.getElementById('fl-language').value; // reads hidden input
    const err = document.getElementById('fl-err');
    err.textContent = '';
    if (!name) { err.textContent = 'Name is required.'; return; }

    const btn = document.getElementById('fl-save');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span> Creating…';

    try {
      await Profile.create({ name, emoji, color: '#E8B33C', language });
      closeModal('cw-generic-modal');
      showToast(`${name} added! 🎉`, 'success');
      try {
        const me = await Backend.me();
        State.user = me.user || me;
        Auth.setUser(State.user);
      } catch {}
      this.renderShareCta(1);
    } catch (e) {
      err.textContent = e.message || 'Could not create profile.';
      btn.disabled = false;
      btn.textContent = 'Create profile';
    }
  },
  
        selectFirstLang(lang, btnEl) {
    const container = document.getElementById('fl-lang-chips');
    if (container) {
      container.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
    }
    btnEl.classList.add('active');
    document.getElementById('fl-language').value = lang;
  },

    async dismissFamilyPrompt() {
    try {
      await Backend.updateProfile({ familyPromptDismissedAt: new Date().toISOString() });
      if (State.user) State.user.familyPromptDismissedAt = new Date().toISOString();
      
      const host = document.getElementById('share-cta');
      if (host) {
        const u = State.user || {};
        const langName = (CW_CONFIG.LANGUAGES[State.currentLanguage] || {}).name || 'your language';
        
        let firstName = 'Friend';
        try {
          if (typeof Heritage !== 'undefined' && Heritage.firstName) {
            firstName = Heritage.firstName(u) || 'Friend';
          } else if (u.fullName) {
            firstName = u.fullName.split(' ')[0];
          }
        } catch (e) {}

        host.innerHTML = `
          <div class="first-card">
            <b>🪪 Your first lesson is done. Your ClearWords card is ready!</b>
            <p>${esc(firstName)}, you're officially ${esc(ShareCards.art(langName))} ${esc(langName)} learner. See your spirit age and show your family.</p>
            <button class="btn btn-block" onclick="ShareCards.openIdentity()">Make my card →</button>
          </div>`;
      }
    } catch (e) {
      showToast('Could not dismiss prompt.', 'error');
    }
  },

  async submitCompletion() {
    const lesson = this.activeLesson;
    const statusEl = document.getElementById('complete-status');

    const totalExercises = (lesson.practiceExercises || []).length;
    const correctExercises = this.exerciseAnswers.filter(a => a.correct).length;
    const perfect = totalExercises > 0 && correctExercises === totalExercises;

    const payload = {
      language: State.currentLanguage,
      lessonId: lesson.id,
      levelNumber: lesson.levelNumber,
      perfect,
      timeSpentSeconds: Math.max(60, Math.round((Date.now() - (this._lessonStart || Date.now())) / 1000)),
      mistakesCount: totalExercises - correctExercises
    };

    if (statusEl) statusEl.textContent = 'Saving your progress…';

    try {
      const res = await Backend.completeLesson(payload);
      if (statusEl) {
        const xp = res.xpEarned || res.xp || lesson.xpReward || 25;
        const streak = res.streak || (this.progress && this.progress.streak);
        statusEl.innerHTML = `Saved · <strong style="color: var(--brand);">+${xp} XP</strong>${streak ? ' · 🔥 ' + streak + ' day streak' : ''}`;
      }
      const updated = await State.loadProgress(State.currentLanguage);
      if (updated) { this.progress = updated; this.render(); }
      const done = updated ? Math.max((updated.completedLessons || []).length, (updated.completedLevels || []).length) : 0;
      this.renderShareCta(done);
      Backend.me().then(r => {
        State.user = r.user || r;
        Auth.setUser(State.user);
        this.user = State.user;
        Header.render('learn');
      }).catch(() => {});
    } catch (e) {
      console.warn('Progress sync failed:', e);
      if (statusEl) statusEl.innerHTML = `<span style="color: var(--danger);">Couldn't sync — retry</span>
        <button class="btn btn-ghost" style="margin-left: 8px; min-height: 32px; padding: 4px 12px; font-size: 12px;" onclick="Learn.submitCompletion()">Retry</button>`;
    }
  },

  /* ============================================================
     CUSTOM LESSON
     ============================================================ */
  openCustomLesson() {
    Header._modal('Create an instant lesson', `
      <p style="font-size: 14px; color: var(--text-2); margin-bottom: 14px;">
        Type any topic and Timmy will build a short lesson for you — vocabulary, dialogue, cultural notes, and a quiz.
      </p>
      <input type="text" class="topic-input" id="topic-input" placeholder="e.g. Ordering suya at a market" autofocus>
      <button class="btn btn-block" id="topic-go" onclick="Learn.createCustomLesson()" style="margin-top: 14px;">
        Generate lesson
      </button>
      <div id="topic-progress" style="margin-top: 20px;"></div>
    `);
    setTimeout(() => {
      const inp = document.getElementById('topic-input');
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') Learn.createCustomLesson(); });
    }, 50);
  },

  async createCustomLesson() {
    const inp = document.getElementById('topic-input');
    const topic = (inp && inp.value || '').trim();
    if (!topic) { showToast('Please type a topic.', 'info'); return; }
    if (topic.length < 3) { showToast('Add a few more words.', 'info'); return; }

    const prog = document.getElementById('topic-progress');
    const btn = document.getElementById('topic-go');
    if (btn) btn.disabled = true;
    if (prog) prog.innerHTML = `
      <div class="loader">
        <div class="spinner"></div>
        <div class="loader-txt">Timmy is crafting your lesson…</div>
        <div class="loader-sub">"${esc(topic)}"</div>
        <div class="loader-sub">This usually takes 15–30 seconds</div>
      </div>`;

    try {
      const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
      const prompt = `Create a mini ${langCfg.name} lesson about "${topic}". Return JSON with these fields:
{
  "title": "short title",
  "description": "one sentence",
  "vocabulary": [{"word": "...", "translation": "...", "pronunciation": "...", "example": "..."}],
  "dialogue": [{"speaker": "A", "text": "...", "translation": "..."}],
  "culturalNotes": [{"title": "...", "content": "..."}],
  "practiceExercises": [{"question": "...", "options": ["a","b","c","d"], "correctAnswer": 0}]
}
6 vocabulary items, 4 dialogue lines, 2 cultural notes, 4 practice questions. Only real ${langCfg.name} words.`;

      const res = await Backend.generateCustomLesson(prompt);
      const raw = res.data || res.lesson || res;
      const parsed = typeof raw === 'string' ? this.extractJSON(raw) : raw;

      if (!parsed || !parsed.vocabulary) throw new Error('Bad response shape');

      const synthetic = {
        id: 'custom-' + Date.now(),
        levelNumber: 999,
        title: parsed.title || topic,
        description: parsed.description || ('Custom lesson: ' + topic),
        topic,
        difficulty: 'Custom',
        estimatedTime: '10 min',
        xpReward: 15,
        vocabulary: (parsed.vocabulary || []).slice(0, 8),
        dialogue: (parsed.dialogue || []).slice(0, 8),
        grammarPoints: [],
        culturalNotes: (parsed.culturalNotes || []).slice(0, 4),
        practiceExercises: (parsed.practiceExercises || []).slice(0, 6)
      };

      closeModal('cw-generic-modal');
      this.activeLesson = synthetic;
      this.buildSteps(synthetic);
      this.stepIndex = 0;
      this.exerciseAnswers = [];
      this.wordIndex = 0;
      this.practiceIndex = 0;
      document.getElementById('lesson-flow').classList.add('active');
      document.body.style.overflow = 'hidden';
      this.renderStep();
      this._lessonStart = Date.now();
      showToast('Lesson ready! 🎉', 'success');
    } catch (e) {
      console.error('Custom lesson failed:', e);

      if (Paywall.fromError(e)) {
        closeModal('cw-generic-modal');
        if (btn) btn.disabled = false;
        return;
      }

      if (prog) prog.innerHTML = `
        <div style="padding: 14px; border-radius: 12px; background: rgba(229,72,77,0.08); border: 1px solid rgba(229,72,77,0.3); color: var(--danger); font-size: 13.5px; text-align: center;">
          ${esc(e.message || 'Something went wrong. Try again.')}
        </div>
        <button class="btn btn-ghost btn-block" onclick="Learn.createCustomLesson()" style="margin-top: 12px;">Retry</button>`;
    } finally {
      if (btn) btn.disabled = false;
    }
  },

  extractJSON(text) {
    if (!text) return null;
    let s = String(text).replace(/```json|```/g, '').trim();
    const start = s.indexOf('{');
    const end = s.lastIndexOf('}');
    if (start === -1 || end === -1) return null;
    try { return JSON.parse(s.slice(start, end + 1)); }
    catch (e) { return null; }
  }
};

const origStartLesson = Learn.startLesson.bind(Learn);
Learn.startLesson = function (lessonId) {
  this._lessonStart = Date.now();
  this.wordIndex = 0;
  this.practiceIndex = 0;
  return origStartLesson(lessonId);
};

document.addEventListener('DOMContentLoaded', () => Learn.init());
window.Learn = Learn;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }
</script>
