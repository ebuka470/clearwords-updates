      }
      showToast('Card created! ✨', 'success');
      closeModal('cw-generic-modal');
      this.loadCards();
    } catch (e) {
      console.warn('Create card failed:', e);
      showToast(e.message || 'Could not create card.', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Create card'; }
    }
  },

  async viewCard(cardId) {
    const card = (this.cards || []).find(c => (c._id || c.id) === cardId);
    if (!card) return;
    const d = card.data || card;
    const stats = this.cardStats(d), b = this.cardBig(d.cardType, stats);
    const langCfg = CW_CONFIG.LANGUAGES[d.language] || CW_CONFIG.LANGUAGES.yoruba;

    Header._modal('Your progress card', `
      <div class="pcard ${d.cardType === 'streak' ? 'gold' : ''}" style="min-height: 260px; padding: 24px;">
        <div>
          <div class="pcard-head">${esc(String(d.cardType || 'PROGRESS').toUpperCase())}</div>
          <div class="pcard-big" style="font-size: 46px;">${esc(String(b.value))}</div>
          <div class="pcard-sub" style="font-size: 14px;">${langCfg.name}</div>
          ${d.caption ? `<div class="pcard-sub" style="margin-top: 10px; font-style: italic;">"${esc(d.caption)}"</div>` : ''}
        </div>
        <div class="pcard-foot">
          ⭐ ${stats.xp || 0} XP · 📚 ${stats.lessonsCompleted || 0} lessons · Lvl ${stats.level || 1}
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn btn-ghost" style="flex: 1;" onclick="Comm.shareCardToPod('${cardId}')">Share to pod</button>
        <button class="btn" style="flex: 1;" onclick="Comm.shareCardExternal('${cardId}')">Share externally</button>
      </div>
    `);
  },

  async shareCardToPod(cardId) {
    if (!this.pods.length) { showToast('Join a pod first to share.', 'info'); return; }
    const list = this.pods.map(p => {
      const d = p.data || p;
      const langCfg = CW_CONFIG.LANGUAGES[d.language] || {};
      return `<button class="chip-btn" style="width: 100%; padding: 14px; margin-bottom: 8px;" onclick="Comm.doShareCard('${cardId}', '${p._id || p.id}')">${langCfg.emoji || '👥'} ${esc(d.name || 'Pod')}</button>`;
    }).join('');
    Header._modal('Share to a pod', list);
  },

  async doShareCard(cardId, podId) {
    try {
      await Backend.shareCardToPod(cardId, podId);
      showToast('Shared to pod! 🎉', 'success');
      closeModal('cw-generic-modal');
    } catch (e) {
      showToast(e.message || 'Could not share.', 'error');
    }
  },

  async shareCardExternal(cardId) {
    try {
      const res = await Backend.shareCardExternal(cardId);
      const url = res.shareUrl || res.url;
      if (navigator.share && url) {
        await navigator.share({ title: 'My ClearWords journey', url });
      } else if (url) {
        await navigator.clipboard.writeText(url);
        showToast('Link copied to clipboard! 📋', 'success');
      } else {
        showToast('Card ready to share!', 'success');
      }
      closeModal('cw-generic-modal');
    } catch (e) {
      showToast(e.message || 'Could not share.', 'error');
    }
  }
};

/* ============================================================
   INPUT HANDLERS
   ============================================================ */
document.addEventListener('input', (e) => {
  if (e.target.id === 'chat-input') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
    $('chat-send').disabled = !e.target.value.trim();
  }
  if (e.target.id === 'pairs-search') {
    Comm._pairQuery = e.target.value;
    Comm.renderAllPairs();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    Comm.sendMessage();
  }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.chat-menu-wrap')) $('chat-menu')?.classList.remove('show');
});
document.addEventListener('scroll', (e) => {
  if (e.target && e.target.id === 'chat-scroll') Comm.updateToBottom();
}, true);

document.addEventListener('DOMContentLoaded', () => Comm.init());
window.Comm = Comm;

  // Register the service worker for offline + installability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }
</script>
</body>
</html>
