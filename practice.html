<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E8B57">
<title>ClearWords — Practice</title>
  <!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- Theme color (browser chrome tint on mobile) -->
<meta name="theme-color" content="#2E8B57">

<!-- iOS: full-screen web app when added to home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClearWords">
<link rel="apple-touch-icon" href="/logo.png">

<!-- Android: enables install prompt -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="ClearWords">
<meta name="msapplication-TileColor" content="#2E8B57">
<meta name="msapplication-TileImage" content="/logo.png">
<style>
:root{--brand:#2E8B57;--brand-rgb:46,139,87;--gold:#E8B33C;--gold-rgb:232,179,60;--indigo-rgb:59,91,165;--terracotta-rgb:217,119,87;--danger:#E5484D;--bg:#FAF7F2;--bg-elev:#fff;--card:#fff;--text:#1C1E21;--text-2:#6B6F76;--text-3:#9AA0A6;--border:#E5E1D8;--shadow:0 2px 12px rgba(28,30,33,.06);--shadow-lg:0 8px 28px rgba(28,30,33,.1);--danger-rgb:229,72,77;--border-strong:#D4CFC2;--radius-lg:20px;--radius-full:999px;--indigo:#3B5BA5;--terracotta:#D97757;--radius:14px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0F1114;--bg-elev:#16191D;--card:#1A1D21;--text:#F2EFE9;--text-2:#9AA0A6;--text-3:#6B6F76;--border:#2A2E33;--brand:#4CAF7A;--brand-rgb:76,175,122;--border-strong:#3A3E44;--shadow:0 2px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 28px rgba(0,0,0,.6)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:calc(84px + var(--safe-bot))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#cw-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border)}
.page{max-width:520px;margin:0 auto;padding:0 16px}
.page-hero{padding:22px 4px 18px}.page-hero h1{font-size:24px;font-weight:800}.page-hero p{font-size:14px;color:var(--text-2);margin-top:4px}
.section-h{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;margin:22px 4px 10px}
.method-card,.situation-card{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);background:var(--card);border:1.5px solid var(--border);width:100%;text-align:left;margin-bottom:10px}
.method-card:active,.situation-card:active{transform:scale(.985);border-color:var(--brand)}
.method-icon,.situation-icon{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(var(--brand-rgb),.12)}
.tint-indigo .method-icon{background:rgba(var(--indigo-rgb),.12)}.tint-gold .method-icon{background:rgba(var(--gold-rgb),.14)}.tint-terracotta .method-icon,.situation-icon{background:rgba(var(--terracotta-rgb),.14)}
.method-body,.situation-body{flex:1;min-width:0}
.method-title,.situation-title{font-weight:800;font-size:15px}.method-desc,.situation-desc{font-size:12.5px;color:var(--text-2);margin-top:3px}
.method-chev{color:var(--text-3);font-size:20px}
.method-badge{position:absolute;top:12px;right:46px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center}
.usage-bar{display:flex;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(var(--brand-rgb),.06);border:1px solid rgba(var(--brand-rgb),.22);font-size:13px;font-weight:600;margin-bottom:14px}
.usage-bar.warning{background:rgba(var(--gold-rgb),.08);color:var(--gold)}.usage-bar.limit{background:rgba(229,72,77,.08);color:var(--danger)}
.usage-bar .label{flex:1}.usage-bar .count{font-weight:800}
#cw-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:8px 8px calc(8px + var(--safe-bot));background:var(--card);border-top:1px solid var(--border);max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--text-3);font-size:11px;font-weight:600}
.tab.active{color:var(--brand)}.tab svg{width:22px;height:22px}
.modal-loading{padding:40px;text-align:center;color:var(--text-2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;min-height:46px}

/* ===== TIMMY OVERLAY ===== */
#timmy-view{position:fixed;inset:0;height:100dvh;z-index:9999;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
#timmy-view.active{display:flex}
#timmy-list-view,#timmy-chat-view{flex:1 1 auto;min-height:0;width:100%;max-width:520px;margin:0 auto;flex-direction:column;position:relative;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.chat-topbar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-top)) 14px 12px;background:var(--bg);border-bottom:1px solid var(--border);position:relative;z-index:2}
.chat-back,.chat-menu-btn{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-2);border-radius:50%}
.chat-back:active,.chat-menu-btn:active{background:var(--border)}
.chat-avatar{width:40px;height:40px;border-radius:50%;background:rgba(var(--brand-rgb),.14);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.chat-name{flex:1;min-width:0;font-weight:800;font-size:16px;line-height:1.2}
.chat-name span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-name small{display:block;font-weight:500;font-size:12px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-menu-wrap{position:relative;flex-shrink:0}
.chat-menu{position:absolute;top:44px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:190px;box-shadow:var(--shadow-lg);display:none;z-index:10}
.chat-menu.show{display:block}
.chat-menu button{display:block;width:100%;padding:10px 14px;text-align:left;font-size:13.5px;border-radius:8px;font-weight:600}
.chat-menu button:hover{background:rgba(var(--brand-rgb),.08)}.chat-menu button.danger{color:var(--danger)}
.chat-list-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:96px}
.chat-list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.chat-list-item:active{background:rgba(var(--brand-rgb),.06)}
.chat-list-avatar{width:48px;height:48px;border-radius:50%;background:rgba(var(--brand-rgb),.14);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.chat-list-body{flex:1;min-width:0}
.chat-list-title{font-weight:700;font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-preview{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-list-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;margin-left:8px}
.chat-list-time,.chat-list-count{font-size:11.5px;color:var(--text-3)}
.chat-list-unread{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:800;line-height:22px;text-align:center}
.chat-list-empty,.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;gap:12px}
.chat-list-empty-emoji,.chat-empty-emoji{font-size:56px}.chat-list-empty-title,.chat-empty-title{font-size:18px;font-weight:800}
.chat-list-empty-sub,.chat-empty-sub{font-size:14px;color:var(--text-2);max-width:280px}
.chat-fab{position:absolute;right:18px;bottom:calc(24px + var(--safe-bot));width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.chat-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 14px 20px;display:flex;flex-direction:column;gap:6px}
.chat-daysep{align-self:center;margin:12px 0;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.06);font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase}
.msg-row{display:flex;flex-direction:column;max-width:82%;gap:3px}
.msg-row.user{align-self:flex-end;align-items:flex-end}.msg-row.bot{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;max-width:100%}
.msg-row.bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg-row.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg-row.bot .bubble.is-error{background:rgba(229,72,77,.08);border-color:rgba(229,72,77,.35);color:var(--danger)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}.msg-row.bot .bubble strong{color:var(--brand)}
.bubble ul,.bubble ol{margin:6px 0 8px;padding-left:20px}
.msg-meta{font-size:10.5px;color:var(--text-3);padding:0 4px}
.msg-row.typing .bubble{display:flex;gap:4px;padding:14px 18px}
.msg-row.typing .bubble span{width:7px;height:7px;border-radius:50%;background:var(--text-3);animation:tb 1.2s infinite}
.msg-row.typing .bubble span:nth-child(2){animation-delay:.15s}.msg-row.typing .bubble span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.scaffold-row{flex-shrink:0;display:flex;gap:8px;padding:8px 14px;overflow-x:auto;border-top:1px solid var(--border)}
.scaffold-chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--brand);color:var(--brand);font-size:13px;font-weight:700;white-space:nowrap}
.chat-foot{flex-shrink:0;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + var(--safe-bot));background:var(--card);border-top:1px solid var(--border)}
.chat-input{flex:1;padding:12px 16px;font-size:16px;border-radius:22px;background:var(--bg-elev);border:1.5px solid var(--border);color:var(--text);font-family:inherit;resize:none;max-height:120px;line-height:1.4;outline:none}
.chat-input:focus{border-color:var(--brand)}
.chat-send{width:46px;height:46px;border-radius:50%;flex-shrink:0;background:var(--brand);color:#fff;font-size:18px}
.chat-send:disabled{opacity:.4}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}
.btn-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn-block{width:100%;margin-top:12px}
.empty-note{color:var(--text-2);font-size:14px;text-align:center;padding:40px 16px}
.empty-note strong{color:var(--text);display:block;font-size:16px;margin-bottom:6px}
.word-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.word-row-body{flex:1;min-width:0}.word-row-term{font-weight:800;font-size:15px;color:var(--brand)}
.word-row-pron{font-size:11.5px;color:var(--text-3);margin-top:1px;font-style:italic}.word-row-trans{font-size:13px;color:var(--text-2);margin-top:2px}
.word-row-play{width:36px;height:36px;border-radius:50%;background:rgba(var(--brand-rgb),.12);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.word-row-play:active{background:var(--brand);color:#fff}
.speak-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 22px;text-align:center;margin-bottom:16px}
.speak-word{font-size:34px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1.15}
.speak-pron{font-size:14px;color:var(--text-3);margin-top:8px;font-style:italic}.speak-trans{font-size:17px;margin-top:14px;color:var(--text-2)}
.mic-btn{width:84px;height:84px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:20px auto 8px;font-size:32px;box-shadow:0 4px 20px rgba(var(--brand-rgb),.35)}
.mic-btn:active{transform:scale(.94)}.mic-btn.recording{background:var(--danger);animation:mp 1.2s infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.4)}50%{box-shadow:0 0 0 16px rgba(229,72,77,0)}}
.mic-hint{font-size:12.5px;color:var(--text-3);text-align:center;margin-top:6px}
.speak-result{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.5;text-align:left}
.speak-result.info{background:rgba(var(--brand-rgb),.06);border:1px solid rgba(var(--brand-rgb),.25)}
.speak-result.warn{background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.35)}
.ex-opt{width:100%;text-align:left;padding:16px 18px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-elev);font-weight:600;font-size:15px}
.ex-opt:active{border-color:var(--brand)}.ex-opt:disabled{opacity:1;cursor:default}
/* ===== SHARED SHELL STYLES (header, nav, modals, toast, forms) — same as community.html ===== */
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
body{-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
#cw-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:saturate(180%) blur(12px)}
.hdr-left,.hdr-right{display:flex;align-items:center;gap:8px}
.lang-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:14px;font-weight:700}
.lang-pill .chev{color:var(--text-3);font-size:11px}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card);border:1px solid var(--border);position:relative;color:var(--text)}
.streak-btn{width:auto;padding:0 12px;gap:4px;font-weight:700;font-size:13px;color:var(--gold);background:rgba(var(--gold-rgb),.12);border-color:rgba(var(--gold-rgb),.28)}
.streak-icon{font-size:14px}
.notif-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card)}
#cw-bottom-nav{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(16px);justify-content:space-around;align-items:center}
.tab{border-radius:10px;position:relative}.tab:active{transform:scale(.94)}
.tab-badge{position:absolute;top:2px;right:22%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--card);pointer-events:none;animation:badgePop .25s ease}
.method-badge{box-shadow:0 0 0 2px var(--card);pointer-events:none;animation:badgePop .25s ease}
@keyframes badgePop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cw-modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.cw-modal-overlay.active{display:flex}
.cw-modal{width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;animation:modalUp .25s ease;border:1px solid var(--border);border-bottom:none}
@keyframes modalUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.cw-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.cw-modal-title{font-weight:800;font-size:16px}
.cw-modal-close{font-size:26px;line-height:1;color:var(--text-2);padding:0 4px}
.cw-modal-body{padding:16px 20px 24px;overflow-y:auto;flex:1}
.lang-option{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-elev);text-align:left}
.lang-option.active{border-color:var(--brand);background:rgba(var(--brand-rgb),.08)}
.lang-emoji{font-size:22px}.lang-name{flex:1;font-weight:700;font-size:15px}.lang-check{color:var(--brand);font-weight:800}
.notif-item{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--bg-elev);border:1px solid var(--border);margin-bottom:8px}
.notif-item.unread{border-color:rgba(var(--brand-rgb),.35);background:rgba(var(--brand-rgb),.05)}
.notif-icon{font-size:20px;flex-shrink:0}.notif-body{flex:1;min-width:0}
.notif-title{font-weight:700;font-size:13px}.notif-text{font-size:12.5px;color:var(--text-2);margin-top:2px}.notif-time{font-size:11px;color:var(--text-3);margin-top:4px}
.cw-toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:20000;opacity:0;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;box-shadow:var(--shadow-lg)}
.cw-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cw-toast-error{background:var(--danger);color:#fff}.cw-toast-success{background:var(--brand);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--text-2)}
.field input,.field textarea,.field select{width:100%;padding:14px 16px;font-size:16px;border-radius:12px;background:var(--bg-elev);border:1.5px solid var(--border);color:var(--text);-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
.field-hint{font-size:12px;color:var(--text-3)}.field-error{font-size:12.5px;color:var(--danger);min-height:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-tint-primary{background:rgba(var(--brand-rgb),.06);border-color:rgba(var(--brand-rgb),.22)}
.chip-btn{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--bg-elev);border:1.5px solid var(--border);color:var(--text)}
.chip-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.chip-btn:active{transform:scale(.97)}
.btn-secondary{background:var(--text);color:var(--bg)}.btn-danger{background:var(--danger);color:#fff}.btn-sm{padding:9px 16px;min-height:36px;font-size:13px}
.spinner-inline{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--border) 0%,#D4CFC2 50%,var(--border) 100%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header id="cw-header"></header>

<main class="page">
  <div class="page-hero"><h1>Practice</h1><p>Talk, listen, and get comfortable with the sounds of the language.</p></div>
  <div id="usage-bar" class="usage-bar" style="display:none"><span class="label">Timmy usage today</span><span class="count" id="usage-count">—</span></div>

  <div class="section-h">Talk with Timmy</div>
  <button class="method-card" data-section="practice" onclick="Practice.openSection('practice')"><div class="method-icon">🤓</div><div class="method-body"><div class="method-title">Practice with Timmy</div><div class="method-desc" data-lang-slot="practice">Chat about your latest lesson</div></div><div class="method-chev">›</div></button>

<script src="shared.js"></script>
<script>
/* ---------- Section metadata (id, emoji, title, greeting, system prompt) ---------- */
const SECTIONS = {
  practice: { emoji:'🤓', title:'Practice with Timmy', sub:l=>`Practice conversation in ${l}`,
    greeting:(l,n)=>`Hi ${n}! Ready to practice ${l}? Start simple, or type whatever you like.`,
    prompt:'You are Timmy, a friendly tutor. Hold a simple conversation in the target language, correct mistakes gently, and give short English hints.' },
  cultural: { emoji:'🎭', title:'Cultural advice', sub:()=>'Ask about Nigerian customs and context',
    greeting:(l,n)=>`Hi ${n}. Ask me anything about Nigerian culture: ${l} traditions, food, family customs, respect, proverbs, everyday life.`,
    prompt:'You are Timmy, a guide to Nigerian culture. Explain customs, etiquette, proverbs and when to use words. Be concise and practical.' },
  quick: { emoji:'⚡', title:'Quick translations', sub:()=>'Fast translations and explanations',
    greeting:(l,n)=>`Hi ${n}. Give me any word or phrase and I'll translate it into ${l} with pronunciation.`,
    prompt:'You are Timmy doing quick translations. Give the translation, a pronunciation guide, and a one-line usage note. Keep replies short.' },
  greeting_parent: { emoji:'🏠', title:'Greeting a parent', sub:()=>'Respectful morning and evening greetings',
    greeting:(l,n)=>`Hi ${n}. Let's practice greeting an older family member in ${l}. You're the younger person, I'm the elder.`,
    prompt:'Role-play an elder parent. The learner greets you in the target language. Reply in character, then briefly coach their respect and tone.' },
  meeting_friend: { emoji:'👋', title:'Meeting a friend', sub:()=>'Casual, warm, and natural',
    greeting:(l,n)=>`Alright ${n}! Let's do a casual, friendly greeting with a peer in ${l}.`,
    prompt:'Role-play a friend meeting the learner. Keep it casual and natural, then give brief feedback.' },
  market: { emoji:'🛒', title:'At the market', sub:()=>'Asking prices and haggling politely',
    greeting:(l,n)=>`Market scene in ${l}, ${n}. You're the buyer, I'm the seller. Ask the price of tomatoes.`,
    prompt:'Role-play a market seller. The learner is the buyer. Haggle politely, then give brief language feedback.' },
  meal_sharing: { emoji:'🍲', title:'Sharing a meal', sub:()=>'Offering and accepting food',
    greeting:(l,n)=>`Let's practice a meal-sharing conversation in ${l}. I'll offer food, you accept or politely decline.`,
    prompt:'Role-play someone offering food. The learner accepts or declines politely. Coach phrasing afterwards.' },
  directions: { emoji:'🚗', title:'Asking for directions', sub:()=>'Finding your way without a phone',
    greeting:(l,n)=>`${n}, you're lost in a Nigerian city and need directions in ${l}. I'm a stranger on the street. Ask away.`,
    prompt:'Role-play a stranger giving directions in a Nigerian city. Use simple target-language phrases with English help.' },
  showing_respect: { emoji:'🙏', title:'Showing respect', sub:()=>'The right words for elders',
    greeting:(l,n)=>`Let's practice showing respect to an elder in ${l}, ${n}. These phrases matter a lot.`,
    prompt:'Teach and drill respectful phrases for elders, with correct honorifics and body-language notes.' }
};
const SITUATIONS = ['greeting_parent','meeting_friend','market','meal_sharing','directions','showing_respect'];
const ROLEPLAY = ['practice', ...SITUATIONS];
const $ = id => document.getElementById(id);

const Practice = {
  user:null, messages:[], sending:false, currentSection:null, currentChatId:null, _cache:{},

  async init() {
    if (!(await cwBoot())) return;
    Header.render('practice');
    this.user = State.user;
    this.setupLangSlots(); this.renderSituations(); this.renderSavedCount(); this.loadUsage();
    this.flushOfflineQueue().catch(()=>{});
    this.maybeImportLocalChats().catch(()=>{});
    this.refreshSectionBadges();
    State.on('hydrated', () => { this.user = State.user; this.renderSavedCount(); });
    State.on('language:changed', () => { this.setupLangSlots(); this._cache = {}; this.refreshSectionBadges(); });
    State.on('unread:changed', () => this.renderSectionBadges());
    window.addEventListener('popstate', () => {
      if (this.currentChatId) this.backToList();
      else if (this.currentSection) this.closeTimmy();
    });
  },

  setupLangSlots() {
    const el = document.querySelector('[data-lang-slot="practice"]');
    if (el) el.textContent = `Chat in ${CW_CONFIG.LANGUAGES[State.currentLanguage].name} about your latest lesson`;
  },

  async loadUsage() {
    const bar = $('usage-bar'), count = $('usage-count');
    try {
      const c = (await Backend.getAIUsage())?.chat || {};
      const label = bar.querySelector('.label');
      bar.style.display = 'flex'; bar.classList.remove('warning','limit');
      if (c.unlimited) { count.textContent = '∞'; label.textContent = 'Unlimited Timmy messages'; return; }
      const limit = c.limit ?? 200, rem = c.remaining ?? Math.max(0, limit - (c.used ?? 0));
      count.textContent = rem + ' / ' + limit;
      if (rem === 0) bar.classList.add('limit'); else if (rem <= limit * .15) bar.classList.add('warning');
      label.textContent = rem === 0 ? 'Daily limit reached — resets at midnight' : 'Timmy messages remaining today';
    } catch { bar.style.display = 'none'; }
  },

  renderSavedCount() {
    const n = ((this.user && this.user.savedWords) || []).length;
    $('saved-count-text').textContent = n ? `${n} word${n===1?'':'s'} saved from your lessons` : "Review words you've saved during lessons";
  },

  renderSituations() {
    $('situations-list').innerHTML = SITUATIONS.map(id => { const s = SECTIONS[id]; return `
      <button class="situation-card" data-section="${id}" onclick="Practice.openSection('${id}')">
        <div class="situation-icon">${s.emoji}</div>
        <div class="situation-body"><div class="situation-title">${esc(s.title)}</div><div class="situation-desc">${esc(s.sub())}</div></div>
        <div class="method-chev">›</div></button>`; }).join('');
    this.renderSectionBadges();
  },

  /* ---------- unread badges: sum of unread across every chat in a section ---------- */
  async refreshSectionBadges() {
    await Promise.all(Object.keys(SECTIONS).map(id => this.loadSectionChats(id, { force:true }).catch(()=>{})));
    this.renderSectionBadges();
  },
  renderSectionBadges() {
    for (const id of Object.keys(SECTIONS)) {
      const n = Object.values(this._cache[id] || {}).reduce((s,c) => s + (c.unreadCount || 0), 0);
      const card = document.querySelector(`[data-section="${id}"]`); if (!card) continue;
      let b = card.querySelector('.method-badge');
      if (n > 0) { if (!b) { b = document.createElement('div'); b.className = 'method-badge'; card.appendChild(b); } b.textContent = n > 99 ? '99+' : n; }
      else if (b) b.remove();
    }
  },

  /* ---------- storage: _cache[sectionId][chatId] ---------- */
  _chatKey(sid, cid) { return `cw_timmy_chat_full_${State.currentLanguage}_${sid}_${cid}`; },
  _queueKey() { return 'cw_timmy_offline_queue_v2'; },

  async loadSectionChats(sid, { force = false } = {}) {
    if (!force && this._cache[sid]) return this._cache[sid];
    try {
      const res = await Backend.listTimmyChats(sid, State.currentLanguage), chats = {};
      for (const c of (res.chats || [])) chats[c.chatId] = {
        id:c.chatId, title:c.title, unreadCount:c.unreadCount || 0,
        lastMessageAt:c.lastMessageAt ? new Date(c.lastMessageAt).getTime() : 0,
        messageCount:c.messageCount || 0, lastMessage:c.lastMessage || null, messages:null };
      for (const [id, c] of Object.entries(this._cache[sid] || {}))   // keep chats the server hasn't accepted yet
        if (c.unsynced && !chats[id]) { chats[id] = c; this.retryCreate(sid, c); }
      return (this._cache[sid] = chats);
    } catch (e) { console.warn('loadSectionChats', e.message); return (this._cache[sid] = this._cache[sid] || {}); }
  },

  async retryCreate(sid, c) {
    try {
      await Backend.createTimmyChat({ sectionId:sid, language:State.currentLanguage, chatId:c.id, title:c.title, greeting:c.messages?.[0]?.content || '' });
      delete c.unsynced;
    } catch (e) { console.warn('retryCreate', e.message); }
  },

  async loadChat(sid, cid) {
    const key = this._chatKey(sid, cid); let cached = null;
    try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
    const refresh = async () => {
      try {
        const chat = (await Backend.getTimmyChat(sid, cid)).chat;
        const messages = (chat.messages || []).map(m => ({ id:m._id, role:m.role, content:m.content, ts:new Date(m.ts).getTime(), isError:!!m.isError }));
        try { localStorage.setItem(key, JSON.stringify({ chat, messages })); } catch {}
        const last = messages[messages.length - 1];
        this._cache[sid] = this._cache[sid] || {};
        this._cache[sid][cid] = { ...(this._cache[sid][cid] || {}), id:cid, title:chat.title, unreadCount:0,
          lastMessageAt:chat.lastMessageAt ? new Date(chat.lastMessageAt).getTime() : 0,
          messageCount:chat.messageCount || messages.length,
          lastMessage:last ? { role:last.role, content:last.content, ts:last.ts } : null, messages };
        if (this.currentChatId === cid && messages.length >= this.messages.length) { this.messages = messages; this.renderChat(); this.scrollToBottom(); }
        return { chat, messages };
      } catch (e) { console.warn('loadChat', e.message); return null; }
    };
    if (cached && cached.messages) { refresh().then(() => this.renderScaffold()); return cached; }
    return await refresh();
  },

  queueOffline(item) {
    try { const q = JSON.parse(localStorage.getItem(this._queueKey()) || '[]'); q.push({ ...item, ts:Date.now() }); localStorage.setItem(this._queueKey(), JSON.stringify(q.slice(-200))); } catch {}
  },
  async flushOfflineQueue() {
    let q = []; try { q = JSON.parse(localStorage.getItem(this._queueKey()) || '[]'); } catch {}
    const left = [];
    for (const i of q) { try { await Backend.appendTimmyChatMessage(i.sectionId, i.chatId, i.role, i.content, i.isError); } catch { left.push(i); } }
    try { left.length ? localStorage.setItem(this._queueKey(), JSON.stringify(left)) : localStorage.removeItem(this._queueKey()); } catch {}
  },
  async markChatReadServer(sid, cid) {
    try { await Backend.markTimmyChatRead(sid, cid); if (this._cache[sid]?.[cid]) this._cache[sid][cid].unreadCount = 0; State.emit('timmy:chat-read', { sectionId:sid, chatId:cid }); }
    catch (e) { console.warn('markChatRead', e.message); }
  },

  /* ---------- navigation: Practice tab → chat list → chat ---------- */
  async openSection(sid) {
    const s = SECTIONS[sid]; if (!s) return;
    this.currentSection = sid; this.currentChatId = null;
    this.showOverlay();
    $('timmy-list-view').style.display = 'flex'; $('timmy-chat-view').style.display = 'none';
    $('list-avatar').textContent = s.emoji; $('list-title').textContent = s.title;
    $('list-sub').textContent = s.sub(CW_CONFIG.LANGUAGES[State.currentLanguage].name);
    $('timmy-chat-list').innerHTML = '<div class="modal-loading">Loading chats…</div>';
    await this.loadSectionChats(sid, { force:true });
    if (this.currentSection === sid && !this.currentChatId) this.renderChatList(sid);
  },

  renderChatList(sid) {
    const host = $('timmy-chat-list'); if (!host) return;
    const chats = Object.values(this._cache[sid] || {}).sort((a,b) => (b.lastMessageAt||0) - (a.lastMessageAt||0));
    if (!chats.length) {
      host.innerHTML = `<div class="chat-list-empty"><div class="chat-list-empty-emoji">💬</div>
        <div class="chat-list-empty-title">No chats yet</div>
        <div class="chat-list-empty-sub">Start one to begin practicing.</div>
        <button class="btn" onclick="Practice.startNewChat()">+ New chat</button></div>`;
      return;
    }
    host.innerHTML = chats.map(c => {
      const lm = c.lastMessage || (c.messages && c.messages[c.messages.length - 1]);
      let preview = lm ? String(lm.content || '').replace(/<[^>]+>/g, '').trim() : 'No messages yet';
      if (lm && lm.role === 'assistant') preview = 'T: ' + preview;
      if (preview.length > 60) preview = preview.slice(0, 60) + '…';
      const u = c.unreadCount || 0, n = c.messageCount || (c.messages?.length || 0);
      return `<button class="chat-list-item" onclick="Practice.openChat('${c.id}')">
        <div class="chat-list-avatar">${SECTIONS[sid].emoji}</div>
        <div class="chat-list-body"><div class="chat-list-title">${esc(c.title || 'New chat')}</div><div class="chat-list-preview">${esc(preview)}</div></div>
        <div class="chat-list-meta"><div class="chat-list-time">${esc(this.shortTime(c.lastMessageAt))}</div>
        ${u > 0 ? `<div class="chat-list-unread">${u > 99 ? '99+' : u}</div>` : `<div class="chat-list-count">${n} msg${n===1?'':'s'}</div>`}</div></button>`;
    }).join('');
  },

  shortTime(ts) {
    if (!ts) return '';
    const d = new Date(ts), now = new Date(), min = Math.floor((now - d) / 60000);
    if (min < 1) return 'now'; if (min < 60) return min + 'm';
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    const y = new Date(); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    const days = Math.floor((now - d) / 86400000);
    return days < 7 ? days + 'd' : d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  },

  async startNewChat() {
    const sid = this.currentSection; if (!sid) return;
    const s = SECTIONS[sid], lang = CW_CONFIG.LANGUAGES[State.currentLanguage].name;
    const first = (this.user?.fullName || 'friend').split(' ')[0];
    const cid = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const greeting = s.greeting(lang, first), now = Date.now();
    const messages = [{ id:'a_' + now, role:'assistant', content:greeting, ts:now }];
    this._cache[sid] = this._cache[sid] || {};
    this._cache[sid][cid] = { id:cid, title:s.title, unreadCount:0, lastMessageAt:now, messageCount:1, lastMessage:{ role:'assistant', content:greeting, ts:now }, messages };
    try { localStorage.setItem(this._chatKey(sid, cid), JSON.stringify({ chat:{ title:s.title }, messages })); } catch {}
    try { await Backend.createTimmyChat({ sectionId:sid, language:State.currentLanguage, chatId:cid, title:s.title, greeting }); }
    catch (e) {
      console.error('createTimmyChat failed', e);
      this._cache[sid][cid].unsynced = true;   // kept locally and retried on next list load
      showToast('Chat not saved to server: ' + (e && (e.message || e.code) || 'unknown error'), 'error');
    }
    this.openChat(cid);
  },

  async openChat(cid) {
    const sid = this.currentSection; if (!sid) return;
    const s = SECTIONS[sid], meta = this._cache[sid]?.[cid] || { title:s.title };
    this.currentChatId = cid;
    history.pushState({ t:'chat' }, '');
    $('timmy-avatar').textContent = s.emoji; $('timmy-title').textContent = meta.title || s.title;
    const lang = CW_CONFIG.LANGUAGES[State.currentLanguage].name;
    $('timmy-sub').textContent = s.sub(lang); $('timmy-input').placeholder = `Message Timmy in ${lang}…`;
    $('timmy-list-view').style.display = 'none'; $('timmy-chat-view').style.display = 'flex';
    $('timmy-scroll').innerHTML = '<div class="modal-loading">Loading messages…</div>';
    const r = await this.loadChat(sid, cid);
    this.messages = r?.messages || this._cache[sid]?.[cid]?.messages || [];
    this.renderChat(); this.scrollToBottom(); this.renderScaffold();
    await this.markChatReadServer(sid, cid);
    this.renderSectionBadges(); window.Badges && Badges.refresh();
    setTimeout(() => $('timmy-input')?.focus(), 250);
  },

  backToList() {   // chat → list (called from popstate)
    if (!this.currentSection) return this.closeTimmy();
    this.currentChatId = null; this.messages = [];
    $('timmy-chat-view').style.display = 'none'; $('timmy-list-view').style.display = 'flex';
    this.renderChatList(this.currentSection); this.renderSectionBadges(); window.Badges && Badges.refresh();
  },

  closeTimmy() {   // list → Practice tab (called from popstate)
    this.currentSection = null; this.currentChatId = null;
    const v = $('timmy-view'); v.classList.remove('active'); v.style.display = 'none';
    document.documentElement.style.overflow = ''; document.body.style.cssText = '';
    this.loadUsage(); this.renderSectionBadges(); window.Badges && Badges.refresh();
  },

  showOverlay() {
    const v = $('timmy-view'); v.classList.add('active'); v.style.display = 'flex';
    document.documentElement.style.overflow = 'hidden';
    document.body.style.cssText = 'overflow:hidden;position:fixed;top:0;left:0;right:0;width:100%;height:100%';
    history.pushState({ t:'list' }, '');
  },

  /* ---------- menus ---------- */
  toggleMenu(e, id) { e.stopPropagation(); const m = $(id), open = m.classList.contains('show'); document.querySelectorAll('.chat-menu.show').forEach(x => x.classList.remove('show')); if (!open) m.classList.add('show'); },

  async markAllRead() {
    const sid = this.currentSection; if (!sid) return;
    try {
      await Backend.markTimmySectionRead(sid);
      Object.values(this._cache[sid] || {}).forEach(c => c.unreadCount = 0);
      $('list-menu').classList.remove('show'); this.renderChatList(sid); this.renderSectionBadges();
      State.emit('timmy:section-cleared', { sectionId:sid }); window.Badges && Badges.refresh(); showToast('Marked all as read', 'success');
    } catch (e) { showToast(e.message || 'Could not mark as read', 'error'); }
  },
  async deleteAllChats() {
    const sid = this.currentSection; if (!sid) return;
    if (!confirm(`Delete ALL chats in "${SECTIONS[sid].title}"? This cannot be undone.`)) return;
    this._cache[sid] = {};
    try { await Backend.deleteTimmySection(sid); } catch (e) { console.warn(e); }
    $('list-menu').classList.remove('show'); this.renderChatList(sid); this.renderSectionBadges();
    State.emit('timmy:section-cleared', { sectionId:sid }); window.Badges && Badges.refresh(); showToast('All chats deleted', 'info');
  },
  exportCurrentChat() {
    if (!this.currentChatId) return;
    const text = `ClearWords chat export\nSection: ${SECTIONS[this.currentSection].title}\nLanguage: ${State.currentLanguage}\nDate: ${new Date().toISOString()}\n\n` + this.messages.map(m => `[${m.role.toUpperCase()}] ${m.content}`).join('\n\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'text/plain' }));
    a.download = 'timmy-chat-' + new Date().toISOString().slice(0, 10) + '.txt'; a.click(); URL.revokeObjectURL(a.href);
    $('timmy-menu').classList.remove('show'); showToast('Chat exported', 'success');
  },
  async deleteCurrentChat() {
    if (!this.currentChatId || !confirm('Delete this chat permanently?')) return;
    const sid = this.currentSection, cid = this.currentChatId;
    if (this._cache[sid]) delete this._cache[sid][cid];
    try { await Backend.deleteTimmyChat(sid, cid); } catch (e) { console.warn(e); }
    try { localStorage.removeItem(this._chatKey(sid, cid)); } catch {}
    $('timmy-menu').classList.remove('show'); showToast('Chat deleted', 'info');
    history.back();   // popstate → backToList()
  },

  /* ---------- chat rendering ---------- */
  renderChat() {
    const el = $('timmy-scroll'); if (!el) return;
    if (!this.messages.length) { el.innerHTML = `<div class="chat-empty"><div class="chat-empty-emoji">${SECTIONS[this.currentSection]?.emoji || '💬'}</div><div class="chat-empty-title">Say something to start</div><div class="chat-empty-sub">Type a message below and Timmy will reply.</div></div>`; return; }
    let lastDay = '', lastUser = -1;
    this.messages.forEach((m, i) => { if (m.role === 'user') lastUser = i; });
    el.innerHTML = this.messages.map((m, i) => {
      const day = new Date(m.ts || Date.now()).toDateString(), sep = day !== lastDay ? `<div class="chat-daysep">${this.dayLabel(m.ts)}</div>` : ''; lastDay = day;
      const user = m.role === 'user';
      const body = user ? `<div class="bubble">${esc(m.content)}</div>` : `<div class="bubble ${m.isError ? 'is-error' : ''}">${this.formatBotHTML(m.content)}</div>`;
      return `${sep}<div class="msg-row ${user ? 'user' : 'bot'}">${body}<div class="msg-meta">${this.fmtTime(m.ts)}${user && i === lastUser ? ' · Read' : ''}</div></div>`;
    }).join('');
  },
  dayLabel(ts) {
    const d = new Date(ts || Date.now()), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    return d.toDateString() === t.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  },
  fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`; },
  formatBotHTML(text) {
    const str = String(text ?? '').trim(); if (!str) return '';
    if (/<(p|br|strong|b|em|i|ul|ol|li|h[1-6]|code|pre|blockquote)\b/i.test(str)) {
      let c = str.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<(iframe|object|embed)[\s\S]*?(<\/\1>|>)/gi, '')
        .replace(/\son\w+="[^"]*"/gi, '').replace(/\son\w+='[^']*'/gi, '')
        .replace(/href\s*=\s*(["'])\s*javascript:[^"']*\1/gi, 'href="#"');
      if (!/<p\b/i.test(c)) c = c.split(/\n{2,}/).map(b => `<p>${b.replace(/\n/g, '<br>')}</p>`).join('');
      return c;
    }
    return str.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  },
  renderScaffold() {
    const row = $('scaffold-row'); if (!row) return;
    if (!ROLEPLAY.includes(this.currentSection) || this.messages.some(m => m.role === 'user')) { row.style.display = 'none'; return; }
    const samples = { yoruba:['Ẹ káàrọ̀','Báwo ni?','Mo wà dáadáa'], igbo:['Ndeewo','Kedu?','Ọ dị mma'], hausa:['Sannu','Yaya kake?','Lafiya lau'], pidgin:['How you dey?','I dey fine','Wetin dey happen?'] }[State.currentLanguage] || ['Hello','How are you?',"I'm fine"];
    row.innerHTML = samples.map(s => `<button class="scaffold-chip" onclick="Practice.useScaffold(${JSON.stringify(s).replace(/"/g, '&quot;')})">${esc(s)}</button>`).join('');
    row.style.display = 'flex';
  },
  useScaffold(t) { $('timmy-input').value = t; this.sendMessage(); },
  scrollToBottom() { const s = $('timmy-scroll'); if (s) requestAnimationFrame(() => s.scrollTop = s.scrollHeight); },

  /* ---------- sending ---------- */
  async sendMessage() {
    if (this.sending) return;
    const inp = $('timmy-input'), text = inp?.value.trim();
    if (!text || !this.currentSection || !this.currentChatId) return;
    const sid = this.currentSection, cid = this.currentChatId;
    this.sending = true; inp.value = ''; inp.style.height = 'auto'; $('scaffold-row').style.display = 'none';
    this.messages.push({ id:'u_' + Date.now(), role:'user', content:text, ts:Date.now() });
    this.renderChat(); this.scrollToBottom();

    Backend.appendTimmyChatMessage(sid, cid, 'user', text, false).then(res => {
      const c = this._cache[sid]?.[cid];
      if (c) { c.lastMessageAt = Date.now(); c.messageCount = res.messageCount || c.messageCount; if (res.title) c.title = res.title; c.lastMessage = { role:'user', content:text, ts:Date.now() }; if (this.currentChatId === cid) $('timmy-title').textContent = c.title; }
    }).catch(() => this.queueOffline({ sectionId:sid, chatId:cid, role:'user', content:text, isError:false }));

    const typing = document.createElement('div');
    typing.className = 'msg-row bot typing'; typing.id = 'typing'; typing.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    $('timmy-scroll').appendChild(typing); this.scrollToBottom();
    const sendBtn = $('timmy-send'); sendBtn.disabled = true;

    try {
      const lang = CW_CONFIG.LANGUAGES[State.currentLanguage], user = State.user || {}, s = SECTIONS[sid];
      const history_ = this.messages.slice(-13, -1).filter(m => !m.isError)
        .map(m => `${m.role === 'user' ? 'Learner' : 'Timmy'}: ${String(m.content).replace(/<[^>]+>/g, '')}`).join('\n');
      const context = [`Language: ${lang.name} (${State.currentLanguage})`, `Learner: ${user.fullName || 'learner'}`,
        `Level: ${(State.progress && State.progress.currentLevel) || user.currentLevel || 1}`, `Section: ${s.title}`].join(' | ')
        + `\nInstructions: ${s.prompt}` + (history_ ? `\nConversation so far:\n${history_}` : '');
      const res = await Backend.aiChat(text, context);
      const reply = res.data || res.reply || res.message || "Sorry — I didn't catch that.";
      $('typing')?.remove();
      if (this.currentChatId === cid) { this.messages.push({ id:'a_' + Date.now(), role:'assistant', content:reply, ts:Date.now() }); this.renderChat(); this.scrollToBottom(); }
      this.loadUsage();
      Backend.appendTimmyChatMessage(sid, cid, 'assistant', reply, false).then(() => {
        const c = this._cache[sid]?.[cid]; if (c) { c.lastMessageAt = Date.now(); c.lastMessage = { role:'assistant', content:reply, ts:Date.now() }; }
        State.emit('timmy:chat-updated', { sectionId:sid, chatId:cid });
      }).catch(() => this.queueOffline({ sectionId:sid, chatId:cid, role:'assistant', content:reply, isError:false }));
    } catch (e) {
      $('typing')?.remove();
      if (Paywall.fromError(e)) return;
      const msg = e.code === 'timeout' ? 'Timmy is waking up — this can take 20–30 seconds. Try again.' : (e.message || "Couldn't reach Timmy.");
      this.messages.push({ id:'a_' + Date.now(), role:'assistant', content:msg, ts:Date.now(), isError:true });
      this.renderChat(); this.scrollToBottom();
    } finally { this.sending = false; sendBtn.disabled = false; }
  },

  /* ---------- one-time import of legacy local chats ---------- */
  async maybeImportLocalChats() {
    const lang = State.currentLanguage, flag = 'cw_timmy_migrated_v2_' + lang;
    if (localStorage.getItem(flag)) return;
    try {
      const threads = [], legacy = JSON.parse(localStorage.getItem('cw_timmy_sections_' + lang) || '{}');
      for (const [sid, s] of Object.entries(legacy)) {
        if (!SECTIONS[sid]) continue;
        for (const [cid, c] of Object.entries(s.chats || {}))
          if (Array.isArray(c.messages) && c.messages.length) threads.push({ sectionId:sid, chatId:cid, title:c.title || SECTIONS[sid].title, messages:c.messages });
      }
      for (const k of ['cw_timmy_chat_' + lang, 'cw_timmy_cache_' + lang, 'cw_chat_practice_' + lang, 'cw_chat_cultural_' + lang, 'cw_chat_quick_' + lang]) {
        try {
          const arr = JSON.parse(localStorage.getItem(k) || 'null');
          if (!Array.isArray(arr) || !arr.length) continue;
          const sid = k.includes('cultural') ? 'cultural' : k.includes('quick') ? 'quick' : 'practice';
          threads.push({ sectionId:sid, chatId:'migrated_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), title:SECTIONS[sid].title, messages:arr });
          localStorage.removeItem(k);
        } catch {}
      }
      if (threads.length) await Backend.importTimmyChats(lang, threads);
      localStorage.setItem(flag, '1');
    } catch (e) { console.warn('maybeImportLocalChats', e.message); }
  },

  /* ---------- self-contained bottom-sheet modal (no dependency on shared.js) ---------- */
  modal(title, html) {
    let o = $('cw-practice-modal');
    if (!o) {
      o = document.createElement('div'); o.id = 'cw-practice-modal'; o.className = 'cw-modal-overlay';
      o.innerHTML = '<div class="cw-modal"><div class="cw-modal-head"><div class="cw-modal-title"></div><button class="cw-modal-close" onclick="Practice.closeModal()" aria-label="Close">×</button></div><div class="cw-modal-body"></div></div>';
      o.addEventListener('click', e => { if (e.target === o) Practice.closeModal(); });
      document.body.appendChild(o);
    }
    o.querySelector('.cw-modal-title').textContent = title;
    o.querySelector('.cw-modal-body').innerHTML = html;
    o.classList.add('active');
  },
  closeModal() { $('cw-practice-modal')?.classList.remove('active'); },

  /* ---------- SPEAK MODE ---------- */
  async openSpeak() {
    const saved = (State.user && State.user.savedWords) || [];
    const curriculum = State.curriculumCache[State.currentLanguage] || await State.loadCurriculum(State.currentLanguage);
    let pool = saved.slice();
    if (!pool.length && curriculum) pool = Curriculum.allLessons(curriculum).flatMap(l => l.vocabulary || []).slice(0, 20);
    if (!pool.length) { showToast('Complete a lesson first to practice pronunciation.', 'info'); return; }
    this._speakList = pool;
    Practice.modal('Pronunciation practice', this.speakBody(pool[0], 0, pool));
  },
  speakBody(word, index, pool) {
    const supported = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
    const note = supported
      ? `<div class="mic-hint">Speech recognition uses your browser's built-in engine. For non-English languages, accuracy varies.</div>`
      : `<div class="mic-hint">Your browser doesn't support speech recognition. You can still listen and repeat out loud.</div>`;
    return `
      <div class="speak-card">
        <div class="speak-word">${esc(word.word)}</div>
        ${word.pronunciation ? `<div class="speak-pron">/${esc(word.pronunciation)}/</div>` : ''}
        <div class="speak-trans">${esc(word.translation || '')}</div>
        <button class="btn btn-ghost" onclick="Practice.playSpeakWord(${index})" style="margin-top:18px">🔊 Listen</button>
      </div>
      ${supported ? `<button class="mic-btn" id="mic-btn" onclick="Practice.recordSpeak(${index})">🎤</button>` : ''}
      ${note}
      <div id="speak-result"></div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-ghost" style="flex:1" onclick="Practice.speakPrev(${index})" ${index === 0 ? 'disabled' : ''}>← Prev</button>
        <button class="btn" style="flex:1" onclick="Practice.speakNext(${index}, ${pool.length})" ${index === pool.length - 1 ? 'disabled' : ''}>Next →</button>
      </div>`;
  },
  async playSpeakWord(index) {
    const w = this._speakList[index]; if (!w) return;
    try { await AudioMgr.play(w.word, State.currentLanguage); }
    catch (e) { if (!Paywall.fromError(e)) showToast('Audio unavailable right now.', 'error'); }
  },
  speakPrev(i) { if (i > 0) Practice.modal('Pronunciation practice', this.speakBody(this._speakList[i - 1], i - 1, this._speakList)); },
  speakNext(i, total) { if (i < total - 1) Practice.modal('Pronunciation practice', this.speakBody(this._speakList[i + 1], i + 1, this._speakList)); },
  recordSpeak(index) {
    const w = this._speakList[index]; if (!w) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('Speech recognition not supported here.', 'info'); return; }
    const btn = $('mic-btn'), result = $('speak-result');
    const rec = new SR();
    rec.lang = CW_CONFIG.LANGUAGES[State.currentLanguage].ttsLang || 'en-NG';
    rec.interimResults = false; rec.maxAlternatives = 1;
    const reset = () => { if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; } };
    if (btn) { btn.classList.add('recording'); btn.textContent = '⏹'; }
    if (result) result.innerHTML = '<div class="speak-result info">Listening… speak now.</div>';
    rec.onresult = e => {
      const said = (e.results[0][0].transcript || '').trim();
      const target = String(w.word).toLowerCase().trim(), got = said.toLowerCase().trim();
      const exact = got === target;
      const close = !exact && this.levenshtein(got, target) <= Math.max(2, Math.floor(target.length / 3));
      if (!result) return;
      if (exact) { result.innerHTML = `<div class="speak-result info"><strong>Nice — match!</strong><br>You said: <em>${esc(said)}</em></div>`; showToast('Perfect match! 🎉', 'success'); }
      else if (close) result.innerHTML = `<div class="speak-result info"><strong>Close.</strong><br>You said: <em>${esc(said)}</em><br>Target: <em>${esc(w.word)}</em></div>`;
      else result.innerHTML = `<div class="speak-result warn"><strong>Different sound.</strong><br>You said: <em>${esc(said)}</em><br>Target: <em>${esc(w.word)}</em></div>`;
    };
    rec.onerror = e => { if (result) result.innerHTML = `<div class="speak-result warn">Couldn't capture audio (${e.error || 'unknown'}).</div>`; };
    rec.onend = reset;
    try { rec.start(); } catch { reset(); showToast('Could not start microphone.', 'error'); }
  },
  levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    const d = Array.from({ length:m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) d[i][0] = i;
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  },

  /* ---------- REVIEW (saved words + quiz) ---------- */
  async openReview() {
    const saved = (State.user && State.user.savedWords) || [];
    if (!saved.length) { Practice.modal('Saved words', `<div class="empty-note"><strong>No saved words yet</strong>In any lesson, tap ☆ Save next to a word to keep it here for review.</div>`); return; }
    const list = saved.map((w, i) => `
      <div class="word-row">
        <div class="word-row-body">
          <div class="word-row-term">${esc(w.word)}</div>
          ${w.pronunciation ? `<div class="word-row-pron">/${esc(w.pronunciation)}/</div>` : ''}
          <div class="word-row-trans">${esc(w.translation || '')}</div>
        </div>
        <button class="word-row-play" onclick="Practice.playSaved(${i})">🔊</button>
      </div>`).join('');
    this._saved = saved;
    Practice.modal('Saved words', list + `<button class="btn btn-ghost btn-block" onclick="Practice.startReviewQuiz()" style="margin-top:14px">Quiz me on these ${saved.length} word${saved.length === 1 ? '' : 's'} →</button>`);
  },
  async playSaved(i) {
    const w = this._saved[i]; if (!w) return;
    try { await AudioMgr.play(w.word, w.language || State.currentLanguage); }
    catch (e) { if (!Paywall.fromError(e)) showToast('Audio unavailable right now.', 'error'); }
  },
  startReviewQuiz() {
    const saved = this._saved || [];
    if (saved.length < 4) { showToast('Save at least 4 words to build a quiz.', 'info'); return; }
    Practice.closeModal();
    this._quiz = saved.slice(0, Math.min(8, saved.length)).map(w => {
      const wrong = saved.filter(x => x.word !== w.word).sort(() => Math.random() - .5).slice(0, 3);
      const options = [w.translation, ...wrong.map(x => x.translation)].sort(() => Math.random() - .5);
      return { word:w.word, correctIndex:options.indexOf(w.translation), options };
    });
    this._quizIndex = 0; this._quizCorrect = 0;
    this.renderQuizQuestion();
  },
  renderQuizQuestion() {
    const q = this._quiz[this._quizIndex], total = this._quiz.length, pct = Math.round(this._quizIndex / total * 100);
    Practice.modal('Review quiz', `
      <div style="font-size:12px;color:var(--text-3);font-weight:800;letter-spacing:.08em;text-transform:uppercase">Question ${this._quizIndex + 1} of ${total}</div>
      <div style="height:6px;background:var(--border);border-radius:3px;margin:8px 0 22px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--brand);border-radius:3px"></div></div>
      <div style="font-size:26px;font-weight:800;color:var(--brand);text-align:center;padding:20px 0">${esc(q.word)}</div>
      <div style="text-align:center;color:var(--text-2);font-size:14px;margin-bottom:18px">What does this mean?</div>
      <div style="display:flex;flex-direction:column;gap:10px" id="quiz-opts">
        ${q.options.map((o, i) => `<button class="ex-opt" onclick="Practice.answerQuiz(${i})">${esc(o)}</button>`).join('')}
      </div>
      <div id="quiz-feedback" style="margin-top:14px"></div>`);
  },
  answerQuiz(index) {
    const q = this._quiz[this._quizIndex], correct = q.correctIndex;
    document.querySelectorAll('#quiz-opts .ex-opt').forEach((b, i) => {
      b.disabled = true;
      if (i === correct) { b.style.borderColor = 'var(--brand)'; b.style.background = 'rgba(46,139,87,.10)'; b.style.color = 'var(--brand)'; }
      else if (i === index) { b.style.borderColor = 'var(--danger)'; b.style.background = 'rgba(229,72,77,.08)'; b.style.color = 'var(--danger)'; }
    });
    if (index === correct) this._quizCorrect++;
    $('quiz-feedback').innerHTML = `<button class="btn btn-block" onclick="Practice.nextQuizQuestion()">${this._quizIndex === this._quiz.length - 1 ? 'See results →' : 'Next question →'}</button>`;
  },
  nextQuizQuestion() {
    if (this._quizIndex < this._quiz.length - 1) { this._quizIndex++; this.renderQuizQuestion(); return; }
    const score = this._quizCorrect, total = this._quiz.length, pct = Math.round(score / total * 100);
    const msg = pct === 100 ? 'Perfect!' : pct >= 80 ? 'Great work!' : pct >= 50 ? 'Solid start.' : 'Keep practicing.';
    Practice.modal('Review quiz', `
      <div style="text-align:center;padding:16px 0">
        <div style="font-size:64px">${pct >= 80 ? '🎉' : '💪'}</div>
        <div style="font-size:26px;font-weight:800;margin-top:8px">${msg}</div>
        <div style="font-size:15px;color:var(--text-2);margin-top:6px">You scored ${score}/${total} (${pct}%)</div>
        <button class="btn btn-block" onclick="Practice.closeModal()" style="margin-top:22px">Done</button>
      </div>`);
  },
};

document.addEventListener('input', e => { if (e.target.id === 'timmy-input') { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; } });
document.addEventListener('keydown', e => { if (e.target.id === 'timmy-input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Practice.sendMessage(); } });
document.addEventListener('click', e => { if (!e.target.closest('.chat-menu-wrap')) document.querySelectorAll('.chat-menu.show').forEach(m => m.classList.remove('show')); });
document.addEventListener('DOMContentLoaded', () => Practice.init());
window.Practice = Practice;
  // Register the service worker for offline + installability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }
</script>
</body>
