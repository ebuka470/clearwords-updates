<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E8B57">
<title>ClearWords — Practice</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root {
  --brand: #2E8B57;
  --brand-rgb: 46,139,87;
  --gold: #E8B33C;
  --gold-rgb: 232,179,60;
  --indigo: #3B5BA5;
  --indigo-rgb: 59,91,165;
  --terracotta: #D97757;
  --terracotta-rgb: 217,119,87;
  --danger: #E5484D;
  --bg: #FAF7F2;
  --bg-elev: #FFFFFF;
  --card: #FFFFFF;
  --text: #1C1E21;
  --text-2: #6B6F76;
  --text-3: #9AA0A6;
  --border: #E5E1D8;
  --border-strong: #D4CFC2;
  --shadow: 0 2px 12px rgba(28,30,33,0.06);
  --shadow-lg: 0 8px 28px rgba(28,30,33,0.10);
  --radius: 14px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0F1114;
  --bg-elev: #16191D;
  --card: #1A1D21;
  --text: #F2EFE9;
  --text-2: #9AA0A6;
  --text-3: #6B6F76;
  --border: #2A2E33;
  --border-strong: #3A3E44;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.6);
  --brand: #4CAF7A;
  --brand-rgb: 76,175,122;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  padding-bottom: calc(84px + var(--safe-bot));
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img, svg { display: block; max-width: 100%; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ============ HEADER ============ */
#cw-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: saturate(180%) blur(12px);
}
.hdr-left, .hdr-right { display: flex; align-items: center; gap: 8px; }
.lang-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--radius-full);
  background: var(--card); border: 1px solid var(--border);
  font-size: 14px; font-weight: 700;
}
.lang-pill .chev { color: var(--text-3); font-size: 11px; }
.icon-btn {
  width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--card); border: 1px solid var(--border);
  position: relative; color: var(--text);
}
.streak-btn { width: auto; padding: 0 12px; gap: 4px; font-weight: 700; font-size: 13px; color: var(--gold); background: rgba(var(--gold-rgb), 0.12); border-color: rgba(var(--gold-rgb), 0.28); }
.streak-icon { font-size: 14px; }
.notif-dot {
  position: absolute; top: 8px; right: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); border: 2px solid var(--card);
}

/* ============ PAGE ============ */
.page { max-width: 520px; margin: 0 auto; padding: 0 16px; }
.page-hero { padding: 22px 4px 18px; }
.page-hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.page-hero p { font-size: 14px; color: var(--text-2); margin-top: 4px; }

.section-h { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--text-3); text-transform: uppercase; margin: 22px 4px 10px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}

/* ============ PRACTICE METHOD CARDS ============ */
.method-card {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: var(--radius);
  background: var(--card); border: 1.5px solid var(--border);
  width: 100%; text-align: left; transition: transform .08s, border-color .15s;
  margin-bottom: 10px;
}
.method-card:active { transform: scale(.985); }
.method-icon {
  width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: rgba(var(--brand-rgb), 0.12);
}
.method-card.tint-indigo .method-icon { background: rgba(var(--indigo-rgb), 0.12); }
.method-card.tint-gold .method-icon { background: rgba(var(--gold-rgb), 0.14); }
.method-card.tint-terracotta .method-icon { background: rgba(var(--terracotta-rgb), 0.14); }
.method-body { flex: 1; min-width: 0; }
.method-title { font-weight: 800; font-size: 15px; }
.method-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.4; }
.method-chev { color: var(--text-3); font-size: 20px; }

.method-badge {
  position: absolute;
  top: 12px;
  right: 46px;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  line-height: 20px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--card);
  pointer-events: none;
}

/* ============ USAGE BADGE ============ */
.usage-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 12px;
  background: rgba(var(--brand-rgb), 0.06);
  border: 1px solid rgba(var(--brand-rgb), 0.22);
  font-size: 13px; font-weight: 600;
  margin-bottom: 14px;
}
.usage-bar.warning { background: rgba(var(--gold-rgb), 0.08); border-color: rgba(var(--gold-rgb), 0.35); color: var(--gold); }
.usage-bar.limit { background: rgba(229,72,77,0.08); border-color: rgba(229,72,77,0.35); color: var(--danger); }
.usage-bar .label { flex: 1; }
.usage-bar .count { font-weight: 800; }

/* ============ BOTTOM NAV ============ */
#cw-bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 8px calc(8px + var(--safe-bot));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
  max-width: 520px; margin: 0 auto;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px; border-radius: 10px;
  color: var(--text-3); font-size: 11px; font-weight: 600;
  position: relative;
}
.tab.active { color: var(--brand); }
.tab svg { width: 22px; height: 22px; }
.tab:active { transform: scale(.94); }

.tab-badge {
  position: absolute;
  top: 2px;
  right: 22%;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10.5px;
  font-weight: 800;
  line-height: 18px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--card);
  pointer-events: none;
  animation: badgePop 0.25s ease;
}
@keyframes badgePop {
  0% { transform: scale(0.4); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* ============ MODAL ============ */
.cw-modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.cw-modal-overlay.active { display: flex; }
.cw-modal {
  width: 100%; max-width: 520px;
  max-height: 88vh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 24px 24px 0 0;
  animation: modalUp .25s ease;
  border: 1px solid var(--border); border-bottom: none;
}
@keyframes modalUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.cw-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
.cw-modal-title { font-weight: 800; font-size: 16px; }
.cw-modal-close { font-size: 26px; line-height: 1; color: var(--text-2); padding: 0 4px; }
.cw-modal-body { padding: 16px 20px 24px; overflow-y: auto; }

.lang-option {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 14px 16px; margin-bottom: 8px;
  border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg-elev); text-align: left;
}
.lang-option.active { border-color: var(--brand); background: rgba(var(--brand-rgb), 0.08); }
.lang-emoji { font-size: 22px; }
.lang-name { flex: 1; font-weight: 700; font-size: 15px; }
.lang-check { color: var(--brand); font-weight: 800; }

.notif-item { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg-elev); border: 1px solid var(--border); margin-bottom: 8px; }
.notif-item.unread { border-color: rgba(var(--brand-rgb), 0.35); background: rgba(var(--brand-rgb), 0.05); }
.notif-icon { font-size: 20px; flex-shrink: 0; }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-weight: 700; font-size: 13px; }
.notif-text { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.notif-time { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.modal-loading { padding: 40px; text-align: center; color: var(--text-2); font-size: 14px; }

.cw-toast {
  position: fixed; left: 50%; bottom: 100px;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 12px 20px; border-radius: var(--radius-full);
  font-size: 14px; font-weight: 600; z-index: 200;
  opacity: 0; transition: opacity .2s, transform .2s;
  max-width: 90%; text-align: center; box-shadow: var(--shadow-lg);
}
.cw-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.cw-toast-error { background: var(--danger); color: #fff; }
.cw-toast-success { background: var(--brand); color: #fff; }

/* ============================================================
   TIMMY VIEW — one overlay with two sub-views
   ============================================================ */
#timmy-view {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 9999;
  background: var(--bg);
  display: none;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
#timmy-view.active { display: flex; }

/* ---- Top bar ---- */
.chat-topbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + var(--safe-top)) 14px 10px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--indigo) 100%);
  color: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.10);
  position: relative;
  z-index: 2;
}
.chat-back {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff;
  border-radius: 50%;
  flex-shrink: 0;
}
.chat-back:active { background: rgba(255,255,255,0.15); }
.chat-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: 2px solid rgba(255,255,255,0.45);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.chat-name {
  flex: 1; min-width: 0;
  font-weight: 800; font-size: 15.5px; color: #fff;
  line-height: 1.2;
}
.chat-name small {
  display: block;
  font-weight: 500; font-size: 11.5px;
  color: rgba(255,255,255,0.85);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-menu-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  position: relative;
  border-radius: 50%;
}
.chat-menu-btn:active { background: rgba(255,255,255,0.15); }
.chat-menu {
  position: absolute; top: 44px; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px; min-width: 180px;
  box-shadow: var(--shadow-lg);
  display: none; z-index: 10;
  color: var(--text);
}
.chat-menu.show { display: block; }
.chat-menu button {
  display: block; width: 100%; padding: 10px 14px; text-align: left;
  font-size: 13.5px; border-radius: 8px; color: var(--text);
}
.chat-menu button:hover { background: rgba(var(--brand-rgb), 0.08); }
.chat-menu button.danger { color: var(--danger); }

/* ---- Chat list view ---- */
.chat-list-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.chat-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
  text-align: left;
  width: 100%;
}
.chat-list-item:active { background: rgba(var(--brand-rgb), 0.06); }
.chat-list-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(var(--brand-rgb), 0.14);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.chat-list-body { flex: 1; min-width: 0; }
.chat-list-title {
  font-weight: 700; font-size: 15px;
  color: var(--text);
  margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-list-preview {
  font-size: 13px;
  color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-list-meta {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px;
  flex-shrink: 0;
  margin-left: 8px;
}
.chat-list-time {
  font-size: 11.5px;
  color: var(--text-3);
}
.chat-list-unread {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 11px;
  background: var(--brand);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  line-height: 22px;
  text-align: center;
}
.chat-list-count {
  font-size: 11px;
  color: var(--text-3);
}

.chat-list-empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 24px;
  text-align: center;
  gap: 14px;
}
.chat-list-empty-emoji { font-size: 56px; }
.chat-list-empty-title { font-size: 18px; font-weight: 800; color: var(--text); }
.chat-list-empty-sub { font-size: 14px; color: var(--text-2); max-width: 280px; line-height: 1.55; }

.chat-fab {
  position: absolute;
  right: 18px;
  bottom: calc(24px + var(--safe-bot));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  font-size: 28px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  z-index: 5;
  transition: transform .12s;
}
.chat-fab:active { transform: scale(.92); }

/* ---- Message scroll area ---- */
.chat-scroll {
  flex: 1 1 auto;
  flex-shrink: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
}

.chat-daysep {
  align-self: center;
  margin: 12px 0;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,0.06);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: .04em;
}
[data-theme="dark"] .chat-daysep { background: rgba(255,255,255,0.08); }

.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  gap: 3px;
  animation: msgIn .18s ease;
}
.msg-row.user { align-self: flex-end; align-items: flex-end; }
.msg-row.bot  { align-self: flex-start; align-items: flex-start; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.5;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  max-width: 100%;
}
.msg-row.bot  .bubble {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.msg-row.user .bubble {
  background: var(--brand);
  color: #fff;
  border-bottom-right-radius: 6px;
  white-space: pre-wrap;
}
.msg-row.bot .bubble.is-error {
  background: rgba(229,72,77,0.08);
  border-color: rgba(229,72,77,0.35);
  color: var(--danger);
}
.bubble p { margin: 0 0 8px 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble strong { color: inherit; font-weight: 700; }
.msg-row.bot .bubble strong { color: var(--brand); }
.bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 20px; }
.bubble li { margin-bottom: 3px; }
.bubble code {
  background: rgba(0,0,0,0.06);
  padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, Menlo, monospace; font-size: 13px;
}
.msg-row.user .bubble code { background: rgba(255,255,255,0.22); }

.msg-meta {
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px;
  color: var(--text-3);
  padding: 0 4px;
}
.msg-meta .read-mark {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.msg-row.user .msg-meta .read-mark.read { color: #4FC3F7; }

.msg-row.typing .bubble {
  display: flex; gap: 4px; padding: 14px 18px;
}
.msg-row.typing .bubble span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-3);
  animation: typingBounce 1.2s infinite;
}
.msg-row.typing .bubble span:nth-child(2) { animation-delay: .15s; }
.msg-row.typing .bubble span:nth-child(3) { animation-delay: .3s; }
@keyframes typingBounce {
  0%,60%,100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.chat-empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px;
  text-align: center;
  color: var(--text-2);
  gap: 10px;
}
.chat-empty-emoji { font-size: 56px; }
.chat-empty-title { font-size: 18px; font-weight: 800; color: var(--text); }
.chat-empty-sub { font-size: 14px; max-width: 280px; line-height: 1.55; }

.scaffold-row {
  flex-shrink: 0;
  display: flex; gap: 8px;
  padding: 8px 14px;
  overflow-x: auto;
  background: var(--bg);
  border-top: 1px solid var(--border);
  scrollbar-width: none;
}
.scaffold-row::-webkit-scrollbar { display: none; }
.scaffold-chip {
  padding: 8px 14px; border-radius: 999px;
  background: var(--card); border: 1.5px solid var(--brand);
  color: var(--brand); font-size: 13px; font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.scaffold-chip:active { background: rgba(var(--brand-rgb), 0.08); }

.chat-foot {
  flex-shrink: 0;
  display: flex; gap: 8px; align-items: flex-end;
  padding: 10px 12px calc(10px + var(--safe-bot));
  background: var(--card);
  border-top: 1px solid var(--border);
}
.chat-input {
  flex: 1; padding: 12px 16px; font-size: 16px;
  border-radius: 22px; background: var(--bg-elev);
  border: 1.5px solid var(--border); color: var(--text);
  font-family: inherit; resize: none; max-height: 120px;
  line-height: 1.4;
  outline: none;
}
.chat-input:focus { border-color: var(--brand); }
.chat-send {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: var(--brand); color: #fff; display: flex;
  align-items: center; justify-content: center; font-size: 18px;
  transition: transform .08s, opacity .15s;
}
.chat-send:active { transform: scale(.94); }
.chat-send:disabled { opacity: .4; }

/* ---- REVIEW (Saved Words) ---- */
.word-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--border);
  margin-bottom: 8px;
}
.word-row-body { flex: 1; min-width: 0; }
.word-row-term { font-weight: 800; font-size: 15px; color: var(--brand); }
.word-row-pron { font-size: 11.5px; color: var(--text-3); margin-top: 1px; font-style: italic; }
.word-row-trans { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.word-row-play { width: 36px; height: 36px; border-radius: 50%; background: rgba(var(--brand-rgb), 0.12); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.word-row-play:active { background: var(--brand); color: #fff; }

/* ---- SPEAK MODE ---- */
.speak-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px 22px; text-align: center;
  margin-bottom: 16px;
}
.speak-word { font-size: 34px; font-weight: 800; color: var(--brand); letter-spacing: -0.02em; line-height: 1.15; }
.speak-pron { font-size: 14px; color: var(--text-3); margin-top: 8px; font-style: italic; }
.speak-trans { font-size: 17px; margin-top: 14px; color: var(--text-2); }
.mic-btn {
  width: 84px; height: 84px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: flex; align-items: center; justify-content: center;
  margin: 20px auto 8px; font-size: 32px;
  box-shadow: 0 4px 20px rgba(var(--brand-rgb), 0.35);
  transition: transform .15s, background .2s;
}
.mic-btn:active { transform: scale(.94); }
.mic-btn.recording { background: var(--danger); animation: micPulse 1.2s infinite; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.4); } 50% { box-shadow: 0 0 0 16px rgba(229,72,77,0); } }
.mic-hint { font-size: 12.5px; color: var(--text-3); text-align: center; margin-top: 6px; }
.speak-result {
  margin-top: 16px; padding: 14px 16px; border-radius: 12px;
  font-size: 13.5px; line-height: 1.5; text-align: left;
}
.speak-result.info { background: rgba(var(--brand-rgb), 0.06); border: 1px solid rgba(var(--brand-rgb), 0.25); color: var(--text); }
.speak-result.warn { background: rgba(var(--gold-rgb), 0.08); border: 1px solid rgba(var(--gold-rgb), 0.35); }

/* ---- SITUATIONS ---- */
.situation-card {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: 12px;
  background: var(--card); border: 1.5px solid var(--border);
  margin-bottom: 10px; width: 100%; text-align: left;
}
.situation-card:active { border-color: var(--brand); background: rgba(var(--brand-rgb), 0.05); }
.situation-icon { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(var(--terracotta-rgb), 0.14); }
.situation-body { flex: 1; min-width: 0; }
.situation-title { font-weight: 800; font-size: 15px; }
.situation-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }

/* ---- BUTTONS ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px; border-radius: var(--radius-full);
  font-weight: 700; font-size: 15px;
  background: var(--brand); color: #fff;
  min-height: 46px;
  transition: transform .08s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; }
.btn-ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
.btn-secondary { background: var(--text); color: var(--bg); }
.btn-block { width: 100%; margin-top: 12px; }

/* ---- MISC ---- */
.empty-note { color: var(--text-2); font-size: 14px; text-align: center; padding: 40px 16px; }
.empty-note strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 6px; }
.skel { background: linear-gradient(90deg, var(--border) 0%, var(--border-strong) 50%, var(--border) 100%); background-size: 200% 100%; animation: skel 1.2s infinite; border-radius: 8px; }
.skel-row { height: 14px; margin: 8px 0; }
.skel-block { height: 66px; margin-top: 12px; }
@keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.spinner { width: 42px; height: 42px; border: 4px solid var(--border); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader { text-align: center; padding: 30px 0; }
.loader-txt { font-size: 14px; color: var(--text-2); }

@media (max-width: 380px) {
  .page-hero h1 { font-size: 21px; }
  .speak-word { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<main class="page">

<!-- ============================================================

<script src="shared.js"></script>
<script>
/* ============================================================
   PRACTICE TAB — section → chat list → chat view
   Server-backed via /api/timmy-chats/*
   ============================================================ */

const SECTIONS = {
  practice: {
    id: 'practice', emoji: '🤓', title: 'Practice with Timmy', subtitle: 'Practice conversation',
    headerSub: (lang) => `Practice conversation in ${lang}`,
    greeting: (lang, name) => {
      const greets = { yoruba: 'Ẹ káàbọ̀', igbo: 'Ndeewo', hausa: 'Sannu', pidgin: 'How you dey', urhobo: 'Mavọ', itsekiri: 'Mavọ' };
      const g = greets[State.currentLanguage] || 'Hello';
      return `${g} ${name}! Ready to practice ${lang}? We can start with something simple, or you can type whatever you like.`;
    }
  },
  cultural: {
    id: 'cultural', emoji: '🎭', title: 'Cultural advice', subtitle: 'Nigerian culture',
    headerSub: () => 'Ask about Nigerian customs and context',
    greeting: (lang, name) => `Hi ${name}. I'm Timmy. Ask me anything about Nigerian culture — ${lang} traditions, food, family customs, respect, proverbs, or everyday life. I'll keep it real.`
  },
  quick: {
    id: 'quick', emoji: '⚡', title: 'Quick translations', subtitle: 'Translations',
    headerSub: () => 'Fast translations and explanations',
    greeting: (lang, name) => `Hi ${name}. Give me any word or phrase and I'll translate it into ${lang} with pronunciation. Or type a ${lang} word you heard and I'll break it down.`
  },
  greeting_parent: {
    id: 'greeting_parent', emoji: '🏠', title: 'Greeting a parent', subtitle: 'Respectful greetings',
    headerSub: () => 'Respectful morning and evening greetings',
    greeting: (lang, name) => `Hi ${name}. Let's practice greeting an older family member in ${lang}. You play the younger person, I'll play the elder.`
  },
  meeting_friend: {
    id: 'meeting_friend', emoji: '👋', title: 'Meeting a friend', subtitle: 'Casual greetings',
    headerSub: () => 'Casual, warm, and natural',
    greeting: (lang, name) => `Alright ${name}! Let's do a casual, friendly greeting with a peer in ${lang}. No formal stuff, just how you'd actually talk.`
  },
  market: {
    id: 'market', emoji: '🛒', title: 'At the market', subtitle: 'Buying and haggling',
    headerSub: () => 'Asking prices and haggling politely',
    greeting: (lang, name) => `Let's do a market scene in ${lang}, ${name}. You're the buyer, I'm the seller. Try to ask for the price of tomatoes.`
  },
  meal_sharing: {
    id: 'meal_sharing', emoji: '🍲', title: 'Sharing a meal', subtitle: 'Offering food',
    headerSub: () => 'Offering and accepting food',
    greeting: (lang, name) => `Let's practice a Nigerian meal-sharing conversation in ${lang}. I'll offer food, you accept or politely decline.`
  },
  directions: {
    id: 'directions', emoji: '🚗', title: 'Asking for directions', subtitle: 'Finding your way',
    headerSub: () => 'Finding your way without a phone',
    greeting: (lang, name) => `Okay ${name}, you're lost in a Nigerian city and need to ask for directions in ${lang}. I'm a stranger on the street. Ask away.`
  },
  showing_respect: {
    id: 'showing_respect', emoji: '🙏', title: 'Showing respect', subtitle: 'Words for elders',
    headerSub: () => 'The right words for elders',
    greeting: (lang, name) => `Let's practice showing respect to an elder in ${lang}, ${name}. These phrases matter a lot — get them right and people will smile.`
  }
};

const Practice = {
  user: null,
  messages: [],
  sending: false,
  currentSection: null,
  currentChatId: null,

  // In-memory cache of chat metadata per section (from server)
  _sectionsCache: {},

  async init() {
    const ok = await cwBoot();
    if (!ok) return;
    Header.render('practice');
    this.user = State.user;

    this.setupLangSlots();
    document.title = 'ClearWords — Practice';

    this.renderSituations();
    this.renderSavedCount();
    this.loadUsage();

    // Flush any queued offline messages
    this.flushOfflineQueue().catch(() => {});

    // One-time migration of local-only chats to the server
    this.maybeImportLocalChats().then(() => {
      if (window.Badges) Badges.refresh();
    }).catch(() => {
      if (window.Badges) Badges.refresh();
    });

    State.on('hydrated', () => {
      this.user = State.user;
      this.renderSavedCount();
    });
    State.on('language:changed', () => {
      this.setupLangSlots();
      this.renderSituations();
      this._sectionsCache = {};
      if (window.Badges) Badges.refresh();
    });

    // Badges.start() already runs from cwBoot, but re-render section badges
    // as soon as the unread snapshot updates.
    State.on('unread:changed', () => {
      if (window.Badges) Badges.renderTimmySectionBadges();
    });
  },

  setupLangSlots() {
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
    const slot = document.querySelector('[data-lang-slot="practice"]');
    if (slot) slot.textContent = `Chat in ${langCfg.name} about your latest lesson`;
    document.title = `ClearWords — Practice (${langCfg.name})`;
  },

  async loadUsage() {
    try {
      const u = await Backend.getAIUsage();
      const bar = document.getElementById('usage-bar');
      const count = document.getElementById('usage-count');
      const label = bar?.querySelector('.label');
      if (!bar || !count) return;

      const chat = u?.chat || {};
      const unlimited = chat.unlimited === true;
      const used = chat.used ?? 0;
      const limit = chat.limit ?? 200;
      const remaining = unlimited ? Infinity : (chat.remaining ?? Math.max(0, limit - used));

      bar.style.display = 'flex';
      bar.classList.remove('warning', 'limit');

      if (unlimited) {
        count.textContent = '∞';
        if (label) label.textContent = 'Unlimited Timmy messages';
        return;
      }
      count.textContent = remaining + ' / ' + limit;
      if (remaining === 0) bar.classList.add('limit');
      else if (remaining <= limit * 0.15) bar.classList.add('warning');
      if (label) {
        label.textContent = remaining === 0
          ? 'Daily limit reached — resets at midnight'
          : 'Timmy messages remaining today';
      }
    } catch (e) {
      const bar = document.getElementById('usage-bar');
      if (bar) bar.style.display = 'none';
    }
  },

  renderSavedCount() {
    const el = document.getElementById('saved-count-text');
    if (!el) return;
    const words = (this.user && this.user.savedWords) || [];
    el.textContent = words.length
      ? words.length + ' word' + (words.length === 1 ? '' : 's') + ' saved from your lessons'
      : "Review words you've saved during lessons";
  },

  renderSituations() {
    const container = document.getElementById('situations-list');
    if (!container) return;
    const items = [
      { id: 'greeting_parent',  icon: '🏠', title: 'Greeting a parent',      desc: 'Respectful morning and evening greetings' },
      { id: 'meeting_friend',   icon: '👋', title: 'Meeting a friend',       desc: 'Casual, warm, and natural' },
      { id: 'market',           icon: '🛒', title: 'At the market',          desc: 'Asking prices and haggling politely' },
      { id: 'meal_sharing',     icon: '🍲', title: 'Sharing a meal',         desc: 'Offering and accepting food' },
      { id: 'directions',       icon: '🚗', title: 'Asking for directions',  desc: 'Finding your way without a phone' },
      { id: 'showing_respect',  icon: '🙏', title: 'Showing respect',        desc: 'The right words for elders' }
    ];
    container.innerHTML = items.map(s => `
      <button class="situation-card" data-section="${s.id}" onclick="Practice.openSection('${s.id}')">
        <div class="situation-icon">${s.icon}</div>
        <div class="situation-body">
          <div class="situation-title">${esc(s.title)}</div>
          <div class="situation-desc">${esc(s.desc)}</div>
        </div>
        <div class="method-chev">›</div>
      </button>`).join('');
  },

  /* ============================================================
     STORAGE — server + local cache
     ============================================================ */

  _localSectionsKey(lang)  { return 'cw_timmy_cache_sections_' + (lang || State.currentLanguage); },
  _localChatKey(lang, sid, cid) {
    return `cw_timmy_chat_full_${lang || State.currentLanguage}_${sid}_${cid}`;
  },
  _offlineQueueKey()       { return 'cw_timmy_offline_queue_v2'; },
  _migrationFlagKey(lang)  { return 'cw_timmy_migrated_v2_' + (lang || State.currentLanguage); },

  /**
   * Fetch the list of chats in a section (metadata only).
   * Falls back to local cache if offline.
   */
  async loadSectionChats(sectionId, { force = false } = {}) {
    const lang = State.currentLanguage;

    if (!force && this._sectionsCache[sectionId]) {
      return this._sectionsCache[sectionId];
    }

    try {
      const res = await Backend.listTimmyChats(sectionId, lang);
      const chats = {};
      for (const c of (res.chats || [])) {
        chats[c.chatId] = {
          id: c.chatId,
          title: c.title,
          unreadCount: c.unreadCount || 0,
          lastMessageAt: c.lastMessageAt ? new Date(c.lastMessageAt).getTime() : 0,
          messageCount: c.messageCount || 0,
          lastMessage: c.lastMessage || null,
          messages: null
        };
      }
      this._sectionsCache[sectionId] = chats;

      // Persist metadata-only snapshot for offline
      try {
        const allCached = JSON.parse(localStorage.getItem(this._localSectionsKey(lang)) || '{}');
        allCached[sectionId] = chats;
        localStorage.setItem(this._localSectionsKey(lang), JSON.stringify(allCached));
      } catch {}

      return chats;
    } catch (e) {
      console.warn('loadSectionChats failed, using cache:', e.message);
      try {
        const allCached = JSON.parse(localStorage.getItem(this._localSectionsKey(lang)) || '{}');
        this._sectionsCache[sectionId] = allCached[sectionId] || {};
        return this._sectionsCache[sectionId];
      } catch { return {}; }
    }
  },

  /**
   * Fetch full messages for a single chat.
   * Cached locally for instant paint; refreshed in background.
   */
  async loadChat(sectionId, chatId) {
    const lang = State.currentLanguage;
    const key = this._localChatKey(lang, sectionId, chatId);

    let cached = null;
    try {
      const raw = localStorage.getItem(key);
      if (raw) cached = JSON.parse(raw);
    } catch {}

    const refresh = async () => {
      try {
        const res = await Backend.getTimmyChat(sectionId, chatId);
        const chat = res.chat;
        const messages = (chat.messages || []).map(m => ({
          id: m._id,
          role: m.role,
          content: m.content,
          ts: new Date(m.ts).getTime(),
          isError: !!m.isError
        }));

        try {
          localStorage.setItem(key, JSON.stringify({ chat, messages }));
        } catch {}

        if (!this._sectionsCache[sectionId]) this._sectionsCache[sectionId] = {};
        const existing = this._sectionsCache[sectionId][chatId] || {};
        this._sectionsCache[sectionId][chatId] = {
          ...existing,
          id: chatId,
          title: chat.title,
          unreadCount: 0,
          lastMessageAt: chat.lastMessageAt ? new Date(chat.lastMessageAt).getTime() : 0,
          messageCount: chat.messageCount || messages.length,
          lastMessage: messages.length
            ? { role: messages[messages.length - 1].role, content: messages[messages.length - 1].content, ts: messages[messages.length - 1].ts }
            : null,
          messages
        };

        if (this.currentChatId === chatId && messages.length >= this.messages.length) {
          this.messages = messages;
          this.renderChat();
          this.scrollToBottom();
        }

        return { chat, messages };
      } catch (e) {
        console.warn('loadChat refresh failed:', e.message);
        return null;
      }
    };

    if (cached && cached.messages) {
      refresh().then(() => this.renderScaffold());
      return cached;
    }

    return await refresh();
  },

  /**
   * Queue a message locally when the server is unreachable.
   */
  queueOffline(item) {
    try {
      const raw = localStorage.getItem(this._offlineQueueKey());
      const queue = raw ? JSON.parse(raw) : [];
      queue.push({ ...item, ts: Date.now() });
      localStorage.setItem(this._offlineQueueKey(), JSON.stringify(queue.slice(-200)));
    } catch {}
  },

  async flushOfflineQueue() {
    let queue = [];
    try {
      const raw = localStorage.getItem(this._offlineQueueKey());
      queue = raw ? JSON.parse(raw) : [];
    } catch {}
    if (!queue.length) return;

    const remaining = [];
    for (const item of queue) {
      try {
        await Backend.appendTimmyChatMessage(item.sectionId, item.chatId, item.role, item.content, item.isError);
      } catch {
        remaining.push(item);
      }
    }
    try {
      if (remaining.length) {
        localStorage.setItem(this._offlineQueueKey(), JSON.stringify(remaining));
      } else {
        localStorage.removeItem(this._offlineQueueKey());
      }
    } catch {}
  },

  /**
   * One-time push of local-only chats to the server.
   * Runs the first time a user loads the app after the update.
   */
  async maybeImportLocalChats() {
    const lang = State.currentLanguage;
    if (localStorage.getItem(this._migrationFlagKey(lang))) return;

    try {
      // Old v2 shape: cw_timmy_sections_<lang> = { practice: { chats: {...} } }
      const legacy = JSON.parse(localStorage.getItem('cw_timmy_sections_' + lang) || '{}');
      const threads = [];
      for (const [sid, s] of Object.entries(legacy)) {
        if (!SECTIONS[sid]) continue;
        for (const [cid, c] of Object.entries(s.chats || {})) {
          if (Array.isArray(c.messages) && c.messages.length) {
            threads.push({
              sectionId: sid,
              chatId: cid,
              title: c.title || SECTIONS[sid].title,
              messages: c.messages
            });
          }
        }
      }

      // Older single-thread keys
      const oldKeys = ['cw_timmy_chat_' + lang, 'cw_timmy_cache_' + lang, 'cw_chat_practice_' + lang, 'cw_chat_cultural_' + lang, 'cw_chat_quick_' + lang];
      for (const k of oldKeys) {
        try {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr) || !arr.length) continue;
          let sid = 'practice';
          if (k.includes('cultural')) sid = 'cultural';
          else if (k.includes('quick')) sid = 'quick';
          threads.push({
            sectionId: sid,
            chatId: 'migrated_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            title: SECTIONS[sid]?.title || 'Chat',
            messages: arr
          });
          localStorage.removeItem(k);
        } catch {}
      }

      if (threads.length) {
        await Backend.importTimmyChats(lang, threads);
        console.log(`[Timmy] Imported ${threads.length} local chats to server`);
      }
      localStorage.setItem(this._migrationFlagKey(lang), '1');
    } catch (e) {
      console.warn('maybeImportLocalChats failed:', e.message);
    }
  },

  /**
   * Mark a chat as read on the server.
   */
  async markChatReadServer(sectionId, chatId) {
    try {
      await Backend.markTimmyChatRead(sectionId, chatId);
      if (this._sectionsCache[sectionId]?.[chatId]) {
        this._sectionsCache[sectionId][chatId].unreadCount = 0;
      }
      State.emit('timmy:chat-read', { sectionId, chatId });
    } catch (e) {
      console.warn('markChatReadServer failed:', e.message);
    }
  },

     NAVIGATION
     ============================================================ */

  async openSection(sectionId) {
    const section = SECTIONS[sectionId];
    if (!section) return;
    this.currentSection = sectionId;
    this.currentChatId = null;

    this.showOverlay();
    document.getElementById('timmy-section-view').style.display = 'flex';
    document.getElementById('timmy-chat-view').style.display = 'none';

    this.renderSectionHeader(sectionId);

    const list = document.getElementById('section-chat-list');
    list.innerHTML = '<div class="modal-loading">Loading chats…</div>';

    await this.loadSectionChats(sectionId, { force: true });
    this.renderSectionChatList(sectionId);
  },

  renderSectionHeader(sectionId) {
    const section = SECTIONS[sectionId];
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
    document.getElementById('section-avatar').textContent = section.emoji;
    document.getElementById('section-title').textContent = section.title;
    document.getElementById('section-sub').textContent = section.headerSub
      ? section.headerSub(langCfg.name)
      : section.subtitle || 'All chats';
  },

  renderSectionChatList(sectionId) {
    const host = document.getElementById('section-chat-list');
    if (!host) return;

    const chatsObj = this._sectionsCache[sectionId] || {};
    const chats = Object.values(chatsObj)
      .sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));

    if (!chats.length) {
      host.innerHTML = `
        <div class="chat-list-empty">
          <div class="chat-list-empty-emoji">💬</div>
          <div class="chat-list-empty-title">No chats yet</div>
          <div class="chat-list-empty-sub">Tap + to start a new conversation in this section.</div>
        </div>`;
      return;
    }

    host.innerHTML = chats.map(c => {
      let preview = 'No messages yet';
      if (c.lastMessage?.content) {
        preview = String(c.lastMessage.content).replace(/<[^>]+>/g, '').trim();
        if (c.lastMessage.role === 'assistant') preview = 'T: ' + preview;
      } else if (Array.isArray(c.messages) && c.messages.length) {
        preview = this.previewOf(c.messages[c.messages.length - 1]);
      }
      if (preview.length > 60) preview = preview.slice(0, 60) + '…';

      const time = this.shortTime(c.lastMessageAt);
      const unread = c.unreadCount || 0;
      const count = c.messageCount || (c.messages?.length || 0);

      return `
        <button class="chat-list-item" onclick="Practice.openChat('${c.id}')">
          <div class="chat-list-avatar">${SECTIONS[sectionId].emoji}</div>
          <div class="chat-list-body">
            <div class="chat-list-title">${esc(c.title || 'New chat')}</div>
            <div class="chat-list-preview">${esc(preview)}</div>
          </div>
          <div class="chat-list-meta">
            <div class="chat-list-time">${esc(time)}</div>
            ${unread > 0
              ? `<div class="chat-list-unread">${unread > 99 ? '99+' : unread}</div>`
              : `<div class="chat-list-count">${count} msg${count === 1 ? '' : 's'}</div>`}
          </div>
        </button>`;
    }).join('');
  },

  previewOf(msg) {
    if (!msg) return 'No messages yet';
    let t = String(msg.content || '').replace(/<[^>]+>/g, '').trim().replace(/\s+/g, ' ');
    if (msg.role === 'assistant') t = 'T: ' + t;
    return t.length > 60 ? t.slice(0, 60) + '…' : t;
  },

  shortTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return 'now';
    if (diffMin < 60) return diffMin + 'm';
    if (sameDay) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const yesterday = new Date(); yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    const diffDays = Math.floor(diffMs / 86400000);
    if (diffDays < 7) return diffDays + 'd';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  },

  async createNewChatInSection() {
    if (!this.currentSection) return;
    const sectionId = this.currentSection;
    const section = SECTIONS[sectionId];
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
    const firstName = (this.user?.fullName || 'friend').split(' ')[0];

    const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const greeting = section.greeting
      ? section.greeting(langCfg.name, firstName)
      : `Hi ${firstName}! Let's start.`;

    // Optimistic cache entry so the list has it immediately
    if (!this._sectionsCache[sectionId]) this._sectionsCache[sectionId] = {};
    this._sectionsCache[sectionId][chatId] = {
      id: chatId,
      title: section.title,
      unreadCount: 0,
      lastMessageAt: Date.now(),
      messageCount: 1,
      lastMessage: { role: 'assistant', content: greeting, ts: Date.now() },
      messages: [{ id: 'a_' + Date.now(), role: 'assistant', content: greeting, ts: Date.now() }]
    };

    try {
      await Backend.createTimmyChat({
        sectionId,
        language: State.currentLanguage,
        chatId,
        title: section.title,
        greeting
      });
    } catch (e) {
      console.warn('createTimmyChat failed:', e.message);
      showToast('Could not sync new chat. It will retry.', 'error');
    }

    this.openChat(chatId);
  },

  async openChat(chatId) {
    const sectionId = this.currentSection;
    if (!sectionId) return;

    this.currentChatId = chatId;

    const section = SECTIONS[sectionId];
    const meta = this._sectionsCache[sectionId]?.[chatId] || { title: section.title };
    this.renderChatHeader(sectionId, meta);

    document.getElementById('timmy-section-view').style.display = 'none';
    document.getElementById('timmy-chat-view').style.display = 'flex';
    document.getElementById('timmy-scroll').innerHTML = '<div class="modal-loading">Loading messages…</div>';

    const result = await this.loadChat(sectionId, chatId);
    this.messages = result?.messages || [];

    this.renderChat();
    this.scrollToBottom();
    this.renderScaffold();

    await this.markChatReadServer(sectionId, chatId);
    if (window.Badges) Badges.refresh();

    setTimeout(() => {
      const inp = document.getElementById('timmy-input');
      if (inp) inp.focus();
    }, 250);
  },

  renderChatHeader(sectionId, chat) {
    const section = SECTIONS[sectionId];
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
    document.getElementById('timmy-avatar').textContent = section.emoji;
    document.getElementById('timmy-title').textContent = chat.title || section.title;
    document.getElementById('timmy-sub').textContent = section.headerSub
      ? section.headerSub(langCfg.name)
      : `${section.title} · ${langCfg.name}`;
    const input = document.getElementById('timmy-input');
    if (input) input.placeholder = `Message Timmy in ${langCfg.name}…`;
  },

  backToSectionList() {
    if (!this.currentSection) { this.closeOverlay(); return; }
    this.currentChatId = null;
    this.messages = [];
    document.getElementById('timmy-chat-view').style.display = 'none';
    document.getElementById('timmy-section-view').style.display = 'flex';
    this.renderSectionChatList(this.currentSection);
    if (window.Badges) Badges.refresh();
  },

  backToSections() {
    this.currentSection = null;
    this.currentChatId = null;
    this.closeOverlay();
    if (window.Badges) Badges.refresh();
  },

  showOverlay() {

    document.body.style.left = '0';

    document.body.style.width = '100%';
    document.body.style.height = '100%';

    document.body.style.width = '';
    document.body.style.height = '';

  exportCurrentChat() {
    if (!this.currentChatId || !this.currentSection) return;
    const lines = this.messages.map(m => `[${m.role.toUpperCase()}] ${m.content}`);
    const text = `ClearWords chat export\nSection: ${SECTIONS[this.currentSection].title}\nLanguage: ${State.currentLanguage}\nDate: ${new Date().toISOString()}\n\n${lines.join('\n\n')}`;
    const blob = new Blob([text], { type: 'text/plain' });

    a.href = URL.createObjectURL(blob);
    a.download = 'timmy-chat-' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Chat exported', 'success');
    document.getElementById('timmy-menu')?.classList.remove('show');
  },

  async renameCurrentChat() {
    if (!this.currentChatId || !this.currentSection) return;
    const current = this._sectionsCache[this.currentSection]?.[this.currentChatId];
    const newTitle = prompt('Rename this chat:', current?.title || 'New chat');
    if (newTitle == null) return;
    const trimmed = newTitle.trim();
    if (!trimmed) return;

    try {
      await Backend.renameTimmyChat(this.currentSection, this.currentChatId, trimmed);
      if (current) current.title = trimmed;
      this.renderChatHeader(this.currentSection, { title: trimmed });
      showToast('Renamed', 'success');
    } catch (e) {
      showToast(e.message || 'Could not rename', 'error');
    }
    document.getElementById('timmy-menu')?.classList.remove('show');
  },

  async deleteCurrentChat() {
    if (!this.currentChatId || !this.currentSection) return;
    if (!confirm('Delete this chat permanently?')) return;

    const sectionId = this.currentSection;
    const chatId = this.currentChatId;

    if (this._sectionsCache[sectionId]?.[chatId]) {
      delete this._sectionsCache[sectionId][chatId];
    }

    try {
      await Backend.deleteTimmyChat(sectionId, chatId);
    } catch (e) {
      console.warn('deleteTimmyChat failed:', e.message);
    }

    try { localStorage.removeItem(this._localChatKey(State.currentLanguage, sectionId, chatId)); } catch {}

    document.getElementById('timmy-menu')?.classList.remove('show');
    State.emit('timmy:chat-read', { sectionId, chatId });
    if (window.Badges) Badges.refresh();
    showToast('Chat deleted', 'info');
    this.backToSectionList();
  },

  /* ============================================================
     CHAT RENDERING
     ============================================================ */
  renderChat() {
    const scroll = document.getElementById('timmy-scroll');
    if (!scroll) return;

    if (!this.messages.length) {
      scroll.innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-emoji">${SECTIONS[this.currentSection]?.emoji || '💬'}</div>
          <div class="chat-empty-title">Say something to start</div>
          <div class="chat-empty-sub">Type a message below and Timmy will reply.</div>
        </div>`;
      return;
    }

    let lastDayKey = '';
    let lastUserMsgIndex = -1;
    for (let i = this.messages.length - 1; i >= 0; i--) {
      if (this.messages[i].role === 'user') { lastUserMsgIndex = i; break; }
    }

    const html = this.messages.map((m, i) => {
      const dayKey = new Date(m.ts || Date.now()).toDateString();
      const showDaySep = dayKey !== lastDayKey;
      lastDayKey = dayKey;

      const daySep = showDaySep
        ? `<div class="chat-daysep">${this.formatDayLabel(m.ts)}</div>`
        : '';

      const cls = m.role === 'user' ? 'user' : 'bot';
      const body = m.role === 'user'
        ? `<div class="bubble">${esc(m.content)}</div>`
        : `<div class="bubble ${m.isError ? 'is-error' : ''}">${this.formatBotHTML(m.content)}</div>`;

      const meta = m.role === 'user'
        ? `<div class="msg-meta">
             <span>${this.formatTime(m.ts)}</span>
             ${i === lastUserMsgIndex ? `<span class="read-mark">· Read</span>` : ''}
           </div>`
        : `<div class="msg-meta"><span>${this.formatTime(m.ts)}</span></div>`;

      return `${daySep}<div class="msg-row ${cls}">${body}${meta}</div>`;
    }).join('');

    scroll.innerHTML = html;
  },

  formatDayLabel(ts) {
    const d = new Date(ts || Date.now());
    const today = new Date();
    const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  },

  formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
  },

  formatBotHTML(text) {
    if (text == null) return '';
    const str = String(text).trim();
    if (!str) return '';
    const hasTags = /<(p|br|strong|b|em|i|ul|ol|li|h[1-6]|code|pre|blockquote)\b/i.test(str);
    if (hasTags) {
      let cleaned = str
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/\son\w+="[^"]*"/gi, '')
        .replace(/\son\w+='[^']*'/gi, '');
      if (!/<p\b/i.test(cleaned)) {
        cleaned = cleaned
          .split(/\n{2,}/)
          .map(block => `<p>${block.replace(/\n/g, '<br>')}</p>`)
          .join('');
      }
      return cleaned;
    }
    return str
      .split(/\n{2,}/)
      .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`)
      .join('');
  },

  renderScaffold() {
    const row = document.getElementById('scaffold-row');
    if (!row) return;
    const practiceLike = ['practice', 'greeting_parent', 'meeting_friend', 'market', 'meal_sharing', 'directions', 'showing_respect'];
    if (!practiceLike.includes(this.currentSection)) { row.style.display = 'none'; return; }
    const userTurns = this.messages.filter(m => m.role === 'user').length;
    if (userTurns >= 1) { row.style.display = 'none'; return; }

    const samples = {
      yoruba:  ["Ẹ káàrọ̀", "Báwo ni?", "Mo wà dáadáa"],
      igbo:    ["Ndeewo", "Kedu?", "Ọ dị mma"],
      hausa:   ["Sannu", "Yaya kake?", "Lafiya lau"],
      pidgin:  ["How you dey?", "I dey fine", "Wetin dey happen?"]
    }[State.currentLanguage] || ["Hello", "How are you?", "I'm fine"];

    row.innerHTML = samples.map(s =>
      `<button class="scaffold-chip" onclick="Practice.useScaffold(${JSON.stringify(s).replace(/"/g, '&quot;')})">${esc(s)}</button>`
    ).join('');
    row.style.display = 'flex';
  },

  useScaffold(text) {
    const inp = document.getElementById('timmy-input');
    if (!inp) return;
    inp.value = text;
    this.sendMessage();
  },

  scrollToBottom() {
    const scroll = document.getElementById('timmy-scroll');
    if (scroll) requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
  },

  /* ============================================================
     SENDING
     ============================================================ */
  async sendMessage() {
    if (this.sending) return;
    const inp = document.getElementById('timmy-input');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) return;
    if (!this.currentSection || !this.currentChatId) return;

    this.sending = true;
    inp.value = '';
    inp.style.height = 'auto';
    document.getElementById('scaffold-row').style.display = 'none';

    const userMsg = { id: 'u_' + Date.now(), role: 'user', content: text, ts: Date.now() };
    this.messages.push(userMsg);
    this.renderChat();
    this.scrollToBottom();

    // Persist user message to server
    Backend.appendTimmyChatMessage(this.currentSection, this.currentChatId, 'user', text, false)
      .then(res => {
        const cache = this._sectionsCache[this.currentSection]?.[this.currentChatId];
        if (cache) {
          cache.lastMessageAt = Date.now();
          cache.messageCount = res.messageCount || cache.messageCount;
          if (res.title) cache.title = res.title;
          cache.lastMessage = { role: 'user', content: text, ts: Date.now() };
          this.renderChatHeader(this.currentSection, cache);
        }
      })
      .catch(() => {
        this.queueOffline({
          sectionId: this.currentSection,
          chatId: this.currentChatId,
          role: 'user',
          content: text,
          isError: false
        });
      });

    // Typing indicator
    const scroll = document.getElementById('timmy-scroll');
    const typing = document.createElement('div');
    typing.className = 'msg-row bot typing';
    typing.id = 'typing';
    typing.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    scroll.appendChild(typing);
    this.scrollToBottom();

    const sendBtn = document.getElementById('timmy-send');
    if (sendBtn) sendBtn.disabled = true;

    try {
      const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];
      const user = State.user || {};
      const context = [
        `Language: ${langCfg.name} (${State.currentLanguage})`,
        `Learner: ${user.fullName || 'learner'}`,
        `Level: ${(State.progress && State.progress.currentLevel) || user.currentLevel || 1}`,
        `Section: ${SECTIONS[this.currentSection]?.title || 'Practice'}`
      ].join(' | ');

      const res = await Backend.aiChat(text, context);
      const reply = res.data || res.reply || res.message || "Sorry — I didn't catch that.";

      document.getElementById('typing')?.remove();
      this.messages.push({ id: 'a_' + Date.now(), role: 'assistant', content: reply, ts: Date.now() });
      this.renderChat();
      this.scrollToBottom();
      this.loadUsage();

      Backend.appendTimmyChatMessage(this.currentSection, this.currentChatId, 'assistant', reply, false)
        .then(() => {
          const cache = this._sectionsCache[this.currentSection]?.[this.currentChatId];
          if (cache) {
            cache.lastMessageAt = Date.now();
            cache.lastMessage = { role: 'assistant', content: reply, ts: Date.now() };
          }
          State.emit('timmy:chat-updated', {
            sectionId: this.currentSection,
            chatId: this.currentChatId
          });
        })
        .catch(() => {
          this.queueOffline({
            sectionId: this.currentSection,
            chatId: this.currentChatId,
            role: 'assistant',
            content: reply,
            isError: false
          });
        });
    } catch (e) {
      document.getElementById('typing')?.remove();

      if (Paywall.fromError(e)) {
        this.sending = false;
        if (sendBtn) sendBtn.disabled = false;
        return;
      }

      let msg = "Couldn't reach Timmy.";
      if (e.code === 'timeout') {
        msg = "Timmy is waking up — this can take 20–30 seconds. Try again.";
      } else if (e.message) {
        msg = e.message;
      }
      this.messages.push({ id: 'a_' + Date.now(), role: 'assistant', content: msg, ts: Date.now(), isError: true });
      this.renderChat();
      this.scrollToBottom();
    } finally {
      this.sending = false;
      if (sendBtn) sendBtn.disabled = false;
    }
  },

  /* ============================================================
     SPEAK MODE
     ============================================================ */
  async openSpeak() {
    const saved = (State.user && State.user.savedWords) || [];
    const curriculum = State.curriculumCache[State.currentLanguage] || await State.loadCurriculum(State.currentLanguage);
    let pool = saved.slice();
    if (!pool.length && curriculum) {
      const lessons = Curriculum.allLessons(curriculum);
      pool = lessons.flatMap(l => l.vocabulary || []).slice(0, 20);
    }
    if (!pool.length) {
      showToast('Complete a lesson first to practice pronunciation.', 'info');
      return;
    }
    Header._modal('Pronunciation practice', this.speakBody(pool[0], 0, pool));
    this._speakList = pool;
  },

  speakBody(word, index, pool) {
    const supported = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
    const note = supported
      ? `<div class="mic-hint">Speech recognition uses your browser's built-in engine. For non-English languages, accuracy varies — treat it as a warm-up, not a score.</div>`
      : `<div class="mic-hint">Your browser doesn't support speech recognition. You can still listen and repeat out loud.</div>`;

    return `
      <div class="speak-card">
        <div class="speak-word">${esc(word.word)}</div>
        ${word.pronunciation ? `<div class="speak-pron">/${esc(word.pronunciation)}/</div>` : ''}
        <div class="speak-trans">${esc(word.translation || '')}</div>
        <button class="btn btn-ghost" onclick="Practice.playSpeakWord(${index})" style="margin-top: 18px;">🔊 Listen</button>
      </div>
      ${supported ? `<button class="mic-btn" id="mic-btn" onclick="Practice.recordSpeak(${index})">🎤</button>` : ''}
      ${note}
      <div id="speak-result"></div>
      <div style="display: flex; gap: 10px; margin-top: 18px;">
        <button class="btn btn-ghost" style="flex: 1;" onclick="Practice.speakPrev(${index})" ${index === 0 ? 'disabled' : ''}>← Prev</button>
        <button class="btn" style="flex: 1;" onclick="Practice.speakNext(${index}, ${pool.length})" ${index === pool.length - 1 ? 'disabled' : ''}>Next →</button>
      </div>`;
  },

  async playSpeakWord(index) {
    const w = this._speakList[index];
    if (!w) return;
    try { await AudioMgr.play(w.word, State.currentLanguage); }
    catch (e) { if (!Paywall.fromError(e)) showToast('Audio unavailable right now.', 'error'); }
  },

  speakPrev(index) {
    if (index <= 0) return;
    Header._modal('Pronunciation practice', this.speakBody(this._speakList[index - 1], index - 1, this._speakList));
  },

  speakNext(index, total) {
    if (index >= total - 1) return;
    Header._modal('Pronunciation practice', this.speakBody(this._speakList[index + 1], index + 1, this._speakList));
  },

  recordSpeak(index) {
    const w = this._speakList[index];
    if (!w) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('Speech recognition not supported here.', 'info'); return; }

    const btn = document.getElementById('mic-btn');
    const result = document.getElementById('speak-result');
    const langCfg = CW_CONFIG.LANGUAGES[State.currentLanguage];

    const rec = new SR();
    rec.lang = langCfg.ttsLang || 'en-NG';
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    if (btn) { btn.classList.add('recording'); btn.textContent = '⏹'; }
    if (result) result.innerHTML = '<div class="speak-result info">Listening… speak now.</div>';

    rec.onresult = (e) => {
      const said = (e.results[0][0].transcript || '').trim();
      const target = String(w.word).toLowerCase().trim();
      const got = said.toLowerCase().trim();
      const exact = got === target;
      const close = !exact && this.levenshtein(got, target) <= Math.max(2, Math.floor(target.length / 3));
      if (result) {
        if (exact) {
          result.innerHTML = `<div class="speak-result info"><strong>Nice — match!</strong><br>You said: <em>${esc(said)}</em></div>`;
          showToast('Perfect match! 🎉', 'success');
        } else if (close) {
          result.innerHTML = `<div class="speak-result info"><strong>Close.</strong><br>You said: <em>${esc(said)}</em><br>Target: <em>${esc(w.word)}</em></div>`;
        } else {
          result.innerHTML = `<div class="speak-result warn"><strong>Different sound.</strong><br>You said: <em>${esc(said)}</em><br>Target: <em>${esc(w.word)}</em></div>`;
        }
      }
    };
    rec.onerror = (e) => { if (result) result.innerHTML = `<div class="speak-result warn">Couldn't capture audio (${e.error || 'unknown'}).</div>`; };
    rec.onend = () => { if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; } };

    try { rec.start(); }
    catch (e) {
      if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
      showToast('Could not start microphone.', 'error');
    }
  },

  levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) d[i][0] = i;
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      }
    }
    return d[m][n];
  },

  /* ============================================================
     REVIEW (Saved words)
     ============================================================ */
  async openReview() {
    const saved = (State.user && State.user.savedWords) || [];
    if (!saved.length) {
      Header._modal('Saved words', `
        <div class="empty-note">
          <strong>No saved words yet</strong>
          In any lesson, tap ☆ Save next to a word to keep it here for review.
        </div>`);
      return;
    }
    const list = saved.map((w, i) => `
      <div class="word-row">
        <div class="word-row-body">
          <div class="word-row-term">${esc(w.word)}</div>
          ${w.pronunciation ? `<div class="word-row-pron">/${esc(w.pronunciation)}/</div>` : ''}
          <div class="word-row-trans">${esc(w.translation || '')}</div>
        </div>
        <button class="word-row-play" onclick="Practice.playSaved(${i})">🔊</button>
      </div>`).join('');
    Header._modal('Saved words', list + `
      <button class="btn btn-ghost btn-block" onclick="Practice.startReviewQuiz()" style="margin-top: 14px;">
        Quiz me on these ${saved.length} word${saved.length === 1 ? '' : 's'} →
      </button>`);
    this._saved = saved;
  },

  async playSaved(i) {
    const w = this._saved[i];
    if (!w) return;
    try { await AudioMgr.play(w.word, w.language || State.currentLanguage); }
    catch (e) { if (!Paywall.fromError(e)) showToast('Audio unavailable right now.', 'error'); }
  },

  async startReviewQuiz() {
    const saved = this._saved || [];
    if (saved.length < 4) { showToast('Save at least 4 words to build a quiz.', 'info'); return; }
    closeModal('cw-generic-modal');
    const questions = saved.slice(0, Math.min(8, saved.length)).map(w => {
      const wrong = saved.filter(x => x.word !== w.word).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [w.translation, ...wrong.map(x => x.translation)].sort(() => Math.random() - 0.5);
      return { word: w.word, correctIndex: options.indexOf(w.translation), options };
    });
    this._quiz = questions; this._quizIndex = 0; this._quizCorrect = 0;
    this.renderQuizQuestion();
  },

  renderQuizQuestion() {
    const q = this._quiz[this._quizIndex];
    const total = this._quiz.length;
    const pct = Math.round((this._quizIndex / total) * 100);
    Header._modal('Review quiz', `
      <div style="font-size: 12px; color: var(--text-3); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Question ${this._quizIndex + 1} of ${total}</div>
      <div style="height: 6px; background: var(--border); border-radius: 3px; margin: 8px 0 22px; overflow: hidden;">
        <div style="height: 100%; width: ${pct}%; background: var(--brand); border-radius: 3px;"></div>
      </div>
      <div style="font-size: 26px; font-weight: 800; color: var(--brand); text-align: center; padding: 20px 0;">${esc(q.word)}</div>
      <div style="text-align: center; color: var(--text-2); font-size: 14px; margin-bottom: 18px;">What does this mean?</div>
      <div style="display: flex; flex-direction: column; gap: 10px;" id="quiz-opts">
        ${q.options.map((opt, i) => `<button class="ex-opt" onclick="Practice.answerQuiz(${i})" id="quiz-opt-${i}">${esc(opt)}</button>`).join('')}
      </div>
      <div id="quiz-feedback" style="margin-top: 14px;"></div>
    `);
  },

  answerQuiz(index) {
    const q = this._quiz[this._quizIndex];
    const correct = q.correctIndex;
    document.querySelectorAll('#quiz-opts .ex-opt').forEach((b, i) => {
      b.disabled = true;
      b.style.padding = '16px 18px';
      b.style.borderRadius = '12px';
      b.style.fontWeight = '600';
      b.style.fontSize = '15px';
      if (i === correct) { b.style.borderColor = 'var(--brand)'; b.style.background = 'rgba(46,139,87,0.10)'; b.style.color = 'var(--brand)'; }
      else if (i === index) { b.style.borderColor = 'var(--danger)'; b.style.background = 'rgba(229,72,77,0.08)'; b.style.color = 'var(--danger)'; }
    });
    if (index === correct) this._quizCorrect++;
    const fb = document.getElementById('quiz-feedback');
    if (fb) fb.innerHTML = `<button class="btn btn-block" onclick="Practice.nextQuizQuestion()">${this._quizIndex === this._quiz.length - 1 ? 'See results →' : 'Next question →'}</button>`;
  },

  nextQuizQuestion() {
    if (this._quizIndex < this._quiz.length - 1) {
      this._quizIndex++;
      this.renderQuizQuestion();
    } else {
      const score = this._quizCorrect;
      const total = this._quiz.length;
      const pct = Math.round((score / total) * 100);
      const msg = pct === 100 ? 'Perfect!' : pct >= 80 ? 'Great work!' : pct >= 50 ? 'Solid start.' : 'Keep practicing.';
      Header._modal('Review quiz', `
        <div style="text-align: center; padding: 16px 0;">
          <div style="font-size: 64px;">${pct >= 80 ? '🎉' : '💪'}</div>
          <div style="font-size: 26px; font-weight: 800; margin-top: 8px;">${msg}</div>
          <div style="font-size: 15px; color: var(--text-2); margin-top: 6px;">You scored ${score}/${total} (${pct}%)</div>
          <button class="btn btn-block" onclick="closeModal('cw-generic-modal')" style="margin-top: 22px;">Done</button>
        </div>`);
    }
  }
};

/* ============================================================
   INPUT — enter to send, auto-grow textarea
   ============================================================ */
document.addEventListener('input', (e) => {
  if (e.target.id === 'timmy-input') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'timmy-input' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    Practice.sendMessage();
  }
});

document.addEventListener('click', (e) => {
  const chatMenu = document.getElementById('timmy-menu');
  if (chatMenu?.classList.contains('show') && !e.target.closest('.chat-menu-btn') && !chatMenu.contains(e.target)) {
    chatMenu.classList.remove('show');
  }
  const sectionMenu = document.getElementById('section-menu');
  if (sectionMenu?.classList.contains('show') && !e.target.closest('.chat-menu-btn') && !sectionMenu.contains(e.target)) {
    sectionMenu.classList.remove('show');
  }
});

document.addEventListener('DOMContentLoaded', () => Practice.init());
window.Practice = Practice;
</script>
</body>
</html>
